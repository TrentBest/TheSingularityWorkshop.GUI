name: Build and deploy GUI showcase

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GUI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned commit SHA

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # pinned commit SHA
        with:
          dotnet-version: 8.0.x

      - name: Generate the SVG gallery from the actual GUI.SVG adapter
        run: |
          mkdir -p _site/assets
          dotnet run --project samples/SvgGallery/SvgGallery.csproj --configuration Release -- ./_site/assets/svg-adapter-gallery.svg
          cmp ./_site/assets/svg-adapter-gallery.svg ./docs/assets/svg-adapter-gallery.svg

      - name: Assemble the showcase and runnable browser demonstrations
        run: |
          mkdir -p _site/samples/demonstrations
          cp site/index.html _site/index.html
          cp site/badges.html _site/badges.html
          cp -R docs _site/docs
          cp -R assets/autonomous-design _site/assets/autonomous-design
          cp -R samples/demonstrations/. _site/samples/demonstrations/
          cp docs/assets/fox-sheepdog-10x10.svg _site/assets/fox-sheepdog-10x10.svg
          cp docs/assets/concepts/gui-semantic-boundary.svg _site/assets/gui-semantic-boundary.svg
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/badges.html
          test -s _site/assets/svg-adapter-gallery.svg
          test -s _site/assets/autonomous-design/off.svg
          test -s _site/assets/autonomous-design/working.svg
          test -s _site/samples/demonstrations/index.html
          grep -F 'GUI.SVG Demonstrations' _site/samples/demonstrations/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0 # pinned commit SHA
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the GUI showcase
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # pinned commit SHA

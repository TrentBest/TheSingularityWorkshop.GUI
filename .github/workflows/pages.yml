name: Build and deploy GUI showcase

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GUI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned commit SHA

      - name: Check out Visualize WebGPU experience
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned commit SHA
        with:
          repository: TrentBest/TheSingularityWorkshop.Visualize
          ref: development
          path: _visualize

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # pinned commit SHA
        with:
          dotnet-version: 10.0.x

      - name: Generate the SVG gallery from the actual GUI.SVG adapter
        run: |
          mkdir -p _site/assets
          dotnet run --project samples/SvgGallery/SvgGallery.csproj --configuration Release -- ./_site/assets/svg-adapter-gallery.svg
          cmp ./_site/assets/svg-adapter-gallery.svg ./docs/assets/svg-adapter-gallery.svg

      - name: Verify the Renderer policy consumed by the Visualize browser lab
        run: |
          set -euo pipefail
          node _visualize/samples/SoldierField/WebGpuRunner/renderer-policy.test.mjs
          test -s _visualize/samples/SoldierField/WebGpuRunner/index.html
          test -s _visualize/samples/SoldierField/WebGpuRunner/renderer-policy.json

      - name: Assemble the complete site and runnable browser demonstrations
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R site/. _site/
          mkdir -p _site/visualization-lab
          cp -R _visualize/samples/SoldierField/WebGpuRunner/. _site/visualization-lab/
          git -C _visualize rev-parse HEAD > _site/visualization-lab/source-revision.txt
          cp -R docs _site/docs
          mkdir -p _site/samples/demonstrations
          cp -R samples/demonstrations/. _site/samples/demonstrations/
          cp docs/assets/fox-sheepdog-10x10.svg _site/assets/fox-sheepdog-10x10.svg
          cp docs/assets/concepts/gui-semantic-boundary.svg _site/assets/gui-semantic-boundary.svg
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/capability-atlas.html
          test -s _site/visualization-lab/index.html
          test -s _site/visualization-lab/renderer-policy.json
          test -s _site/visualization-lab/source-revision.txt
          test -s _site/assets/svg-adapter-gallery.svg
          test -s _site/samples/demonstrations/index.html
          grep -F 'GUI.SVG Demonstrations' _site/samples/demonstrations/index.html
          python3 scripts/validate-pages.py --root _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # pinned commit SHA
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the GUI showcase
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # pinned commit SHA

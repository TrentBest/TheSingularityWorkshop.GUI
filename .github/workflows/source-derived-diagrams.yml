name: Source-derived diagrams

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Generate source-derived DataCard diagram
        run: >-
          dotnet run --project samples/SourceUmlGenerator/SourceUmlGenerator.csproj
          --configuration Release --
          src/Core/DataCard.cs artifacts/DataCard.source-structure.svg --verify --uml artifacts/DataCard.uml.svg --type DataCard
      - name: Emit canonical syntax-only UML model
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          dotnet run --project samples/SourceUmlGenerator/SourceUmlGenerator.csproj
          --configuration Release --
          src/Core/DataCard.cs artifacts/DataCard.source-structure.svg
          --model-json artifacts/DataCard.uml-model.json
          --repository TrentBest/TheSingularityWorkshop.GUI
          --revision "$SOURCE_REVISION"
          --project src/Core/TheSingularityWorkshop.GUI.Core.csproj
      - name: Emit project-semantic Core UML model
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          dotnet run --project samples/SourceUmlGenerator/SourceUmlGenerator.csproj
          --configuration Release --
          --project-model-json artifacts/Core.uml-model.json
          --project src/Core/TheSingularityWorkshop.GUI.Core.csproj
          --repository TrentBest/TheSingularityWorkshop.GUI
          --revision "$SOURCE_REVISION"
          --configuration Release
          --reflection-assembly src/Core/bin/Release/net8.0/TheSingularityWorkshop.GUI.Core.dll
          --diagram-svg artifacts/DataCard.semantic-uml.svg
          --diagram-type TheSingularityWorkshop.Workshop.Gui.DataCard
          --inventory-markdown artifacts/Core.uml-inventory.md
          --type-pages-dir artifacts/Core.uml-types
      - name: Prove exact-build reflection gate rejects the wrong assembly
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          log="artifacts/reflection-identity-mismatch.log"
          set +e
          dotnet run --project samples/SourceUmlGenerator/SourceUmlGenerator.csproj \
            --configuration Release -- \
            --project-model-json artifacts/ReflectionIdentityMismatch.uml-model.json \
            --project src/Core/TheSingularityWorkshop.GUI.Core.csproj \
            --repository TrentBest/TheSingularityWorkshop.GUI \
            --revision "$SOURCE_REVISION" \
            --configuration Release \
            --reflection-assembly samples/SourceUmlGenerator/bin/Release/net8.0/SourceUmlGenerator.dll \
            > "$log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0 || { echo "Expected reflection identity mismatch to fail closed"; cat "$log"; exit 1; }
          grep -q "does not match compiler model identity" "$log" || { cat "$log"; exit 1; }
          echo "Verified a different assembly cannot satisfy the exact-build reflection gate."
          
      - name: Verify project-semantic UML model contract
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          model = json.loads(Path("artifacts/Core.uml-model.json").read_text(encoding="utf-8"))
          assert model["schemaVersion"] == "1.0", model.get("schemaVersion")
          provenance = model["provenance"]
          assert provenance["repository"] == "TrentBest/TheSingularityWorkshop.GUI"
          assert provenance["sourceRevision"]
          assert provenance["projectPath"] == "src/Core/TheSingularityWorkshop.GUI.Core.csproj"
          assert provenance["analysisMode"] == "project-semantic"
          assert model["types"], "expected compiled project types"
          inventory = Path("artifacts/Core.uml-inventory.md").read_text(encoding="utf-8")
          assert inventory.startswith("# Generated UML type inventory")
          assert "## TheSingularityWorkshop.Workshop.Gui.DataCard" in inventory
          assert "### Members" in inventory and "### Relationships" in inventory
          assert "Source declarations" in inventory and "sourceRevision" not in inventory
          assert f"/blob/{provenance['sourceRevision']}/" in inventory, "source links must be revision-pinned"

          def qualified_name(item):
              identity = item["identity"]
              strip_arity = lambda value: value.split("`", 1)[0]
              parts = [strip_arity(value) for value in identity["containingTypes"]]
              parts.append(strip_arity(identity["metadataName"]))
              local_name = ".".join(parts)
              return f"{identity['namespace']}.{local_name}" if identity["namespace"] else local_name

          expected_names = sorted(qualified_name(item) for item in model["types"])
          index_lines = [line for line in inventory.splitlines() if line.startswith("| [`")]
          inventory_names = [line.split("[`", 1)[1].split("`]", 1)[0] for line in index_lines]
          assert inventory_names == expected_names, "inventory index must include every type in deterministic order"
          for type_name in expected_names:
              assert f"## {type_name}" in inventory, f"missing per-type section: {type_name}"

          pages_dir = Path("artifacts/Core.uml-types")
          page_files = sorted(path for path in pages_dir.glob("*.md") if path.name != "index.md")
          diagram_files = sorted(pages_dir.glob("*.svg"))
          assert len(page_files) == len(model["types"]), (len(page_files), len(model["types"]))
          assert len(diagram_files) == len(model["types"]), (len(diagram_files), len(model["types"]))
          page_titles = sorted(path.read_text(encoding="utf-8").splitlines()[0][2:] for path in page_files)
          assert page_titles == expected_names, "standalone page set must cover every type exactly once"
          page_index = (pages_dir / "index.md").read_text(encoding="utf-8")
          assert page_index.startswith("# Generated UML type pages")
          assert all("(" + path.name + ")" in page_index for path in page_files), "index must link every generated page"
          assert all("(" + path.name + ")" in page_index for path in diagram_files), "index must link every generated UML SVG"
          for page in page_files:
              page_text = page.read_text(encoding="utf-8")
              diagram = page.with_suffix(".svg")
              assert diagram.is_file(), f"missing UML SVG for {page.name}"
              assert "](" + diagram.name + ")" in page_text, f"page does not embed its UML SVG: {page.name}"
              svg_root = ET.parse(diagram).getroot()
              svg_ns = "{http://www.w3.org/2000/svg}"
              assert svg_root.find(svg_ns + "title") is not None, f"missing SVG title: {diagram.name}"
              assert svg_root.find(svg_ns + "desc") is not None, f"missing SVG description: {diagram.name}"
              assert ("/blob/" + provenance["sourceRevision"] + "/") in page_text, page.name
              assert "[Back to the generated type index](index.md)" in page_text, page.name

          ids = {item["id"] for item in model["types"]}
          assert any(item["identity"]["metadataName"] == "DataCard" for item in model["types"])
          assert any(item["identity"]["metadataName"] == "UmlDocumentationModel" for item in model["types"])
          kinds = {edge["kind"] for edge in model["relationships"]}
          assert "association" in kinds, f"expected member-type associations, got {kinds}"
          assert "dependency" in kinds, f"expected signature dependencies, got {kinds}"
          for edge in model["relationships"]:
              if edge["resolution"] == "resolved":
                  assert edge["targetTypeId"] in ids, edge
                  assert edge["provenance"]["kind"] in ("roslyn-symbol", "roslyn-member-symbol"), edge
          print(f"Validated project-semantic model with {len(model['types'])} types and {len(model['relationships'])} compiler-symbol relationships.")
          PY
      - name: Exercise partial generic semantic UML fixture
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          fixture="artifacts/semantic-fixture"
          mkdir -p "$fixture"
          cat > "$fixture/SemanticFixture.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          XML
          cat > "$fixture/Thing.Part1.cs" <<'CS'
          namespace Fixture;
          public interface IThing<T> { T Get(); }
          public partial class Thing<T> : IThing<T>
          {
              public Other Link { get; set; } = new();
              public T Get() => default!;
              public Other Convert(Other input) => input;
          }
          public sealed class Other { }
          CS
          cat > "$fixture/Thing.Part2.cs" <<'CS'
          namespace Fixture;
          public partial class Thing<T>
          {
              public Other? Another { get; set; }
          }
          CS
          dotnet run --project samples/SourceUmlGenerator/SourceUmlGenerator.csproj \
            --configuration Release -- \
            --project-model-json artifacts/SemanticFixture.uml-model.json \
            --project "$fixture/SemanticFixture.csproj" \
            --repository TrentBest/TheSingularityWorkshop.GUI \
            --revision "$SOURCE_REVISION" \
            --configuration Release \
            --diagram-svg artifacts/SemanticFixture.svg \
            --diagram-type Fixture.Thing
          python3 - <<'PY'
          import json
          from pathlib import Path

          model = json.loads(Path("artifacts/SemanticFixture.uml-model.json").read_text(encoding="utf-8"))
          types = model["types"]
          thing = next(item for item in types if item["identity"]["metadataName"] == "Thing`1")
          interface = next(item for item in types if item["identity"]["metadataName"] == "IThing`1")
          other = next(item for item in types if item["identity"]["metadataName"] == "Other")
          assert len(thing["sourceDeclarations"]) == 2, thing["sourceDeclarations"]
          edges = model["relationships"]
          realization = next(edge for edge in edges if edge["sourceTypeId"] == thing["id"] and edge["kind"] == "interface-realization")
          assert realization["resolution"] == "resolved", realization
          assert realization["targetTypeId"] == interface["id"], realization
          assert any(edge["kind"] == "association" and edge["resolution"] == "resolved" and edge["targetTypeId"] == other["id"] for edge in edges)
          assert any(edge["kind"] == "dependency" and edge["resolution"] == "resolved" and edge["targetTypeId"] == other["id"] for edge in edges)
          from xml.etree import ElementTree
          svg = ElementTree.parse("artifacts/SemanticFixture.svg").getroot()
          assert svg.find("{http://www.w3.org/2000/svg}title") is not None
          assert svg.find("{http://www.w3.org/2000/svg}desc") is not None
          svg_text = " ".join(node.text or "" for node in svg.iter("{http://www.w3.org/2000/svg}text"))
          assert "Fixture.Other" in svg_text
          assert "association" in svg_text
          assert "dependency" in svg_text
          assert "interface realization" in svg_text
          print("Validated partial generic type aggregation, resolved generic interface realization, association, dependency, and model-to-SVG graph rendering.")
          PY
      - name: Verify canonical UML model contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/DataCard.uml-model.json")
          model = json.loads(path.read_text(encoding="utf-8"))
          assert model["schemaVersion"] == "1.0", model.get("schemaVersion")
          provenance = model["provenance"]
          assert provenance["repository"] == "TrentBest/TheSingularityWorkshop.GUI"
          assert provenance["sourceRevision"], "source revision provenance is required"
          assert provenance["projectPath"] == "src/Core/TheSingularityWorkshop.GUI.Core.csproj"
          assert provenance["analysisMode"] == "syntax-only"
          assert model["types"], "expected at least one documented type"
          assert any(t["identity"]["metadataName"] == "DataCard" for t in model["types"])
          assert model["relationships"] == [], "syntax-only mode must not assert semantic relationships"
          print(f"Validated schema {model['schemaVersion']} with {len(model['types'])} type(s); no semantic relationships asserted.")
          PY

      - name: Verify source-derived SVG contract
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/DataCard.source-structure.svg
          grep -q 'DataCard' artifacts/DataCard.source-structure.svg
          grep -q 'GetCollapsedSummary' artifacts/DataCard.source-structure.svg
          grep -q 'Children' artifacts/DataCard.source-structure.svg
          # Source declarations must be grouped beneath explicit namespace cards;
          # color identity is semantic, not inferred from nesting depth.
          grep -q 'namespace:' artifacts/DataCard.source-structure.svg
          grep -q 'stroke="#4f46e5"' artifacts/DataCard.source-structure.svg
          grep -q 'stroke="#ff823d"' artifacts/DataCard.source-structure.svg
          grep -q 'stroke="#f2e83d"' artifacts/DataCard.source-structure.svg
          grep -q 'stroke-width="4"' artifacts/DataCard.source-structure.svg
          test -s artifacts/DataCard.uml.svg
          test -s artifacts/DataCard.semantic-uml.svg
          test -s artifacts/Core.uml-inventory.md
          grep -q "Generated UML type inventory" artifacts/Core.uml-inventory.md
          grep -q 'Source-derived UML neighborhood:' artifacts/DataCard.semantic-uml.svg
          grep -q 'UML class diagram: DataCard' artifacts/DataCard.uml.svg
          grep -q 'GetCollapsedSummary' artifacts/DataCard.uml.svg
          # The generated syntax class view and the authored canonical ecosystem diagram
          # have different contracts/layouts. Validate the generated SVG structurally above;
          # do not overwrite or byte-compare it with the richer checked-in ecosystem diagram.
          test -s docs/assets/uml/classes/Core/DataCard.svg
          grep -q 'UML ecosystem class diagram: DataCard' docs/assets/uml/classes/Core/DataCard.svg
          grep -q 'direct consumer SvgDataCardRenderer' docs/assets/uml/classes/Core/DataCard.svg
      - name: Test SVG contract validator failure cases
        run: python3 -m unittest discover -s scripts -p 'test_verify_svg_contract.py' -v

      - name: Verify SVG accessibility, geometry, IDs, and local references
        run: python3 scripts/verify_svg_contract.py artifacts/DataCard.source-structure.svg artifacts/DataCard.uml.svg artifacts/DataCard.semantic-uml.svg artifacts/SemanticFixture.svg

      - name: Exercise source mutation, explicit type selection, and malformed-source failures
        shell: bash
        run: |
          set -euo pipefail
          generator="samples/SourceUmlGenerator/SourceUmlGenerator.csproj"

          mkdir -p artifacts/uml-fixtures
          cat > artifacts/uml-fixtures/Selection.cs <<'CS'
          namespace Fixture.Alpha { public class Duplicate { public int Value { get; set; } } }
          namespace Fixture.Beta { public class Duplicate { public void Run() { } } }
          CS

          dotnet run --project "$generator" --configuration Release --             artifacts/uml-fixtures/Selection.cs artifacts/uml-fixtures/selection-structure.svg             --uml artifacts/uml-fixtures/selected.svg --type Fixture.Beta.Duplicate
          grep -q 'UML class diagram: Duplicate' artifacts/uml-fixtures/selected.svg
          grep -q 'Run' artifacts/uml-fixtures/selected.svg

          set +e
          dotnet run --project "$generator" --configuration Release --             artifacts/uml-fixtures/Selection.cs artifacts/uml-fixtures/ambiguous-structure.svg             --uml artifacts/uml-fixtures/ambiguous.svg --type Duplicate             > artifacts/uml-fixtures/ambiguous.log 2>&1
          ambiguous_status=$?
          set -e
          test "$ambiguous_status" -eq 2
          grep -q 'ambiguous' artifacts/uml-fixtures/ambiguous.log
          test ! -e artifacts/uml-fixtures/ambiguous.svg

          cat > artifacts/uml-fixtures/Mutation.cs <<'CS'
          namespace Fixture { public class Mutable { public int Before { get; set; } } }
          CS
          dotnet run --project "$generator" --configuration Release --             artifacts/uml-fixtures/Mutation.cs artifacts/uml-fixtures/before.svg --verify
          sed -i 's/Before/After/g' artifacts/uml-fixtures/Mutation.cs
          dotnet run --project "$generator" --configuration Release --             artifacts/uml-fixtures/Mutation.cs artifacts/uml-fixtures/after.svg --verify
          ! cmp -s artifacts/uml-fixtures/before.svg artifacts/uml-fixtures/after.svg
          grep -q 'After' artifacts/uml-fixtures/after.svg
          ! grep -q 'Before' artifacts/uml-fixtures/after.svg

          cat > artifacts/uml-fixtures/Malformed.cs <<'CS'
          namespace Fixture { public class Broken { public void Run( { } } }
          CS
          set +e
          dotnet run --project "$generator" --configuration Release --             artifacts/uml-fixtures/Malformed.cs artifacts/uml-fixtures/malformed.svg             --verify --uml artifacts/uml-fixtures/malformed-uml.svg --type Broken             > artifacts/uml-fixtures/malformed.log 2>&1
          malformed_status=$?
          set -e
          test "$malformed_status" -ne 0
          test ! -e artifacts/uml-fixtures/malformed.svg
          test ! -e artifacts/uml-fixtures/malformed-uml.svg
          grep -q 'error' artifacts/uml-fixtures/malformed.log

      - name: Verify generated-page pruning preserves authored files and rejects unsafe manifests
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          fixture="artifacts/page-pruning-fixture"
          project="$fixture/PagePruningFixture.csproj"
          pages="$fixture/pages"
          mkdir -p "$fixture"
          cat > "$project" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          XML
          cat > "$fixture/Types.cs" <<'CS'
          namespace PruningFixture;
          public sealed class KeepMe { }
          public sealed class RemoveMe { }
          CS
          mkdir -p "$pages"
          printf '%s\n' '# Authored page — must survive generation' > "$pages/authored.md"
          run_generator() {
            dotnet run --project samples/SourceUmlGenerator/SourceUmlGenerator.csproj --configuration Release -- \
              --project-model-json "$fixture/model.json" --project "$project" \
              --repository TrentBest/TheSingularityWorkshop.GUI --revision "$SOURCE_REVISION" \
              --configuration Release --type-pages-dir "$pages"
          }
          run_generator
          stale_page="$(grep -l '^# PruningFixture.RemoveMe$' "$pages"/*.md | head -n 1)"
          test -n "$stale_page"
          test -f "$pages/.source-uml-generated-files"
          test -f "$pages/authored.md"
          cat > "$fixture/Types.cs" <<'CS'
          namespace PruningFixture;
          public sealed class KeepMe { }
          CS
          run_generator
          test ! -e "$stale_page"
          test -f "$pages/authored.md"
          grep -q 'Authored page' "$pages/authored.md"
          ! grep -q 'PruningFixture.RemoveMe' "$pages/index.md"

          unsafe="$fixture/unsafe-pages"
          mkdir -p "$unsafe"
          printf '%s\n' '../outside.md' > "$unsafe/.source-uml-generated-files"
          set +e
          dotnet run --project samples/SourceUmlGenerator/SourceUmlGenerator.csproj --configuration Release -- \
            --project-model-json "$fixture/unsafe-model.json" --project "$project" \
            --repository TrentBest/TheSingularityWorkshop.GUI --revision "$SOURCE_REVISION" \
            --configuration Release --type-pages-dir "$unsafe" > "$fixture/unsafe.log" 2>&1
          unsafe_status=$?
          set -e
          test "$unsafe_status" -ne 0
          grep -q 'unsafe path' "$fixture/unsafe.log"
          test "$(cat "$unsafe/.source-uml-generated-files")" = '../outside.md'

          unsafe_name="$fixture/unsafe-name-pages"
          mkdir -p "$unsafe_name"
          printf '%s\n' '# Authored file — must survive' > "$unsafe_name/authored.md"
          printf '%s\n' 'authored.md' > "$unsafe_name/.source-uml-generated-files"
          set +e
          dotnet run --project samples/SourceUmlGenerator/SourceUmlGenerator.csproj --configuration Release -- \
            --project-model-json "$fixture/unsafe-name-model.json" --project "$project" \
            --repository TrentBest/TheSingularityWorkshop.GUI --revision "$SOURCE_REVISION" \
            --configuration Release --type-pages-dir "$unsafe_name" > "$fixture/unsafe-name.log" 2>&1
          unsafe_name_status=$?
          set -e
          test "$unsafe_name_status" -ne 0
          grep -q 'unsafe path or non-generated filename' "$fixture/unsafe-name.log"
          test -f "$unsafe_name/authored.md"
          grep -q 'Authored file' "$unsafe_name/authored.md"
          echo "Verified stale page/diagram pruning, preservation of authored Markdown, and fail-closed path/name manifest handling."

      - name: Upload generated source-derived diagram
        uses: actions/upload-artifact@v7
        with:
          name: source-derived-gui-svg-diagrams
          path: |
            artifacts/DataCard.*.svg
            artifacts/Core.uml-inventory.md
            artifacts/Core.uml-types/**
          if-no-files-found: error

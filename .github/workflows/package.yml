name: Package GUI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified GUI packages to NuGet.org"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned commit SHA

      - name: Check workflow action references are immutable
        run: python3 scripts/check-workflow-action-pins.py

      - name: Check documentation UML SVG assets
        run: python3 scripts/check-uml-svg-assets.py

      - name: Check repository-local documentation links
        run: python3 scripts/check-doc-links.py

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # pinned commit SHA
        with:
          dotnet-version: 8.0.x

      - name: Checkout pinned Physics source for parameterized Mandelbrot records
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned commit SHA
        with:
          repository: TrentBest/TheSingularityWorkshop.Physics
          ref: 6b7f4ca35e53ce77efd632d8c2cea6f07d9f6373
          path: ./physics-source

      - name: Export default Physics Mandelbrot samples
        run: dotnet run --project ./physics-source/samples/MandelbrotEscapeTime2dExport/MandelbrotEscapeTime2dExport.csproj --configuration Release -- ./artifacts/mandelbrot-default.run.json

      - name: Export parameterized Physics Mandelbrot detail window
        run: dotnet run --project ./physics-source/samples/MandelbrotEscapeTime2dExport/MandelbrotEscapeTime2dExport.csproj --configuration Release -- ./artifacts/mandelbrot-detail.run.json 120 80 160 -0.9 -0.35 -0.2 0.35

      - name: Render and verify default Physics Mandelbrot samples
        run: dotnet run --project samples/demonstrations/MandelbrotEscapeTime2d/MandelbrotEscapeTime2d.csproj --configuration Release -- ./artifacts/mandelbrot-default.run.json ./artifacts/06-mandelbrot-default.generated.svg

      - name: Render and verify parameterized Physics Mandelbrot samples
        run: dotnet run --project samples/demonstrations/MandelbrotEscapeTime2d/MandelbrotEscapeTime2d.csproj --configuration Release -- ./artifacts/mandelbrot-detail.run.json ./artifacts/06-mandelbrot-detail.generated.svg

      - name: Upload Physics-backed GUI.SVG Mandelbrot explorer outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned commit SHA
        with:
          name: gui-svg-physics-mandelbrot-explorer
          path: |
            ./artifacts/mandelbrot-default.run.json
            ./artifacts/06-mandelbrot-default.generated.svg
            ./artifacts/mandelbrot-detail.run.json
            ./artifacts/06-mandelbrot-detail.generated.svg
          if-no-files-found: error

      - name: Restore Core
        run: dotnet restore src/Core/TheSingularityWorkshop.GUI.Core.csproj

      - name: Restore Blazor
        run: dotnet restore src/Blazor/TheSingularityWorkshop.GUI.Blazor.csproj

      - name: Restore SVG
        run: dotnet restore src/SVG/TheSingularityWorkshop.GUI.SVG.csproj

      - name: Restore adapter conformance tests
        run: dotnet restore tests/Adapter.Conformance.Tests/TheSingularityWorkshop.GUI.Adapter.Conformance.Tests.csproj

      - name: Test Core
        run: dotnet test tests/Core.Tests/TheSingularityWorkshop.GUI.Core.Tests.csproj --configuration Release

      - name: Test Blazor
        run: dotnet test tests/Blazor.Tests/TheSingularityWorkshop.GUI.Blazor.Tests.csproj --configuration Release

      - name: Test SVG
        env:
          GUI_UML_REVIEW_ARTIFACT: ./artifacts/uml-self-reference-review.svg
        run: dotnet test tests/SVG.Tests/TheSingularityWorkshop.GUI.SVG.Tests.csproj --configuration Release

      - name: Upload focused UML self-reference review artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned commit SHA
        with:
          name: uml-self-reference-review
          path: ./artifacts/uml-self-reference-review.svg
          if-no-files-found: error

      - name: Test shared adapter conformance
        run: dotnet test tests/Adapter.Conformance.Tests/TheSingularityWorkshop.GUI.Adapter.Conformance.Tests.csproj --configuration Release

      - name: Build WPF adapter
        run: dotnet build src/WPF/TheSingularityWorkshop.GUI.WPF.csproj --configuration Release -p:EnableWindowsTargeting=true

      - name: Generate GUI.SVG feature gallery
        run: dotnet run --project samples/SvgGallery/SvgGallery.csproj --configuration Release -- ./artifacts/svg-adapter-gallery.svg

      - name: Verify generated GUI.SVG gallery
        shell: bash
        run: |
          set -euo pipefail
          gallery="./artifacts/svg-adapter-gallery.svg"
          test -s "$gallery"
          grep -q '<linearGradient' "$gallery"
          grep -q '<clipPath' "$gallery"
          grep -q '<pattern' "$gallery"
          grep -q '<marker' "$gallery"
          grep -q '<filter' "$gallery"
          grep -q '<feTurbulence' "$gallery"
          grep -q '<feDisplacementMap' "$gallery"
          grep -q '<feComponentTransfer' "$gallery"
          grep -q '<feDiffuseLighting' "$gallery"
          grep -q '<feDistantLight' "$gallery"
          grep -q 'filter="url(#surface-relief)"' "$gallery"
          grep -q 'filter="url(#surface-lighting)"' "$gallery"
          grep -q '<use' "$gallery"
          grep -q '<a ' "$gallery"
          grep -q '<animate' "$gallery"
          grep -q '<mpath' "$gallery"
          grep -q '<set' "$gallery"
          grep -q 'aria-label="GUI.SVG manifestation gallery"' "$gallery"
          cmp "$gallery" ./docs/assets/svg-adapter-gallery.svg

      - name: Upload GUI.SVG feature gallery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned commit SHA
        with:
          name: gui-svg-feature-gallery
          path: ./artifacts/svg-adapter-gallery.svg
          if-no-files-found: error

      - name: Generate GUI.SVG fox/sheepdog plane
        run: dotnet run --project samples/FoxSheepdogPlane/FoxSheepdogPlane.csproj --configuration Release -- ./artifacts/fox-sheepdog-10x10.svg

      - name: Verify GUI.SVG fox/sheepdog plane
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "./artifacts/fox-sheepdog-10x10.svg"
          root = ET.parse(path).getroot()
          ns = {"svg": "http://www.w3.org/2000/svg"}
          ids = [node.attrib["id"] for node in root.iter() if "id" in node.attrib]
          assert len(ids) == len(set(ids)), "SVG ids must be unique"
          lines = [node for node in root.findall(".//svg:line", ns)]
          assert len(lines) == 22, f"expected 22 grid lines for a 10x10 plane, got {len(lines)}"
          assert root.find(".//svg:style", ns) is not None, "scene stylesheet is missing"
          assert root.find(".//svg:animateMotion", ns) is not None, "fox route animation is missing"
          print(f"Verified {len(lines)} grid lines and {len(ids)} unique SVG ids.")
          PY

      - name: Upload GUI.SVG fox/sheepdog plane
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned commit SHA
        with:
          name: gui-svg-fox-sheepdog-plane
          path: ./artifacts/fox-sheepdog-10x10.svg

      - name: Generate Drone Construction vision with GUI.SVG
        run: dotnet run --project samples/DroneConstructionVision/DroneConstructionVision.csproj --configuration Release -- ./artifacts/drone-construction-vision.svg

      - name: Verify generated Drone Construction vision
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          path = "./artifacts/drone-construction-vision.svg"
          root = ET.parse(path).getroot()
          ns = {"svg": "http://www.w3.org/2000/svg"}
          assert root.tag.endswith("svg"), "output root is not SVG"
          text = " ".join((node.text or "") for node in root.findall(".//svg:text", ns))
          for phrase in ("DRONE CONSTRUCTION", "TEN EMITTERS", "SKYLANE", "SLIPSTREAM", "HOVER LANE", "not live simulation telemetry"):
              assert phrase.lower() in text.lower(), f"missing storyboard phrase: {phrase}"
          assert len(root.findall(".//svg:rect", ns)) >= 100, "expected a structured grid and panels"
          print(f"Verified {path}: {len(root.findall('.//svg:rect', ns))} rectangles")
          PY

      - name: Upload Drone Construction GUI.SVG vision
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned commit SHA
        with:
          name: gui-svg-drone-construction-vision
          path: ./artifacts/drone-construction-vision.svg
          if-no-files-found: error

      - name: Generate GUI.SVG primitive geometry lesson
        run: dotnet run --project samples/demonstrations/PrimitiveGeometry/PrimitiveGeometry.csproj --configuration Release -- ./artifacts/01-primitive-geometry.generated.svg

      - name: Verify GUI.SVG primitive geometry lesson
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "./artifacts/01-primitive-geometry.generated.svg"
          root = ET.parse(path).getroot()
          ns = {"svg": "http://www.w3.org/2000/svg"}
          assert root.tag == "{http://www.w3.org/2000/svg}svg", "output is not SVG"
          panel = root.find(".//svg:rect[@id='panel']", ns)
          marker = root.find(".//svg:circle[@id='marker']", ns)
          assert panel is not None, "generated panel rectangle is missing"
          assert marker is not None, "generated marker circle is missing"
          assert panel.attrib.get("rx") == "5", "panel corner radius changed"
          assert marker.attrib.get("r") == "8", "marker radius changed"
          viewbox = [float(value) for value in root.attrib["viewBox"].split()]
          assert len(viewbox) == 4, "SVG viewBox must contain four values"
          vx, vy, vw, vh = viewbox
          x, y = float(panel.attrib["x"]), float(panel.attrib["y"])
          width, height = float(panel.attrib["width"]), float(panel.attrib["height"])
          stroke = float(panel.attrib["stroke-width"])
          assert x - stroke / 2 >= vx, "panel stroke clips past left viewBox edge"
          assert y - stroke / 2 >= vy, "panel stroke clips past top viewBox edge"
          assert x + width + stroke / 2 <= vx + vw, "panel stroke clips past right viewBox edge"
          assert y + height + stroke / 2 <= vy + vh, "panel stroke clips past bottom viewBox edge"
          print("Verified GUI.SVG primitive panel and marker, including full panel bounds.")
          PY

      - name: Upload GUI.SVG primitive geometry lesson
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned commit SHA
        with:
          name: gui-svg-primitive-geometry
          path: ./artifacts/01-primitive-geometry.generated.svg
          if-no-files-found: error

      - name: Generate GUI.SVG coordinate transformations lesson
        run: dotnet run --project samples/demonstrations/CoordinateFunctions/CoordinateFunctions.csproj --configuration Release -- ./artifacts/02-coordinate-functions.generated.svg

      - name: Verify GUI.SVG coordinate transformations lesson
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "./artifacts/02-coordinate-functions.generated.svg"
          root = ET.parse(path).getroot()
          ns = {"svg": "http://www.w3.org/2000/svg"}
          assert root.tag == "{http://www.w3.org/2000/svg}svg", "output is not SVG"
          sample_points = [node for node in root.findall(".//svg:circle", ns)
                           if node.attrib.get("id", "").startswith("sample-")]
          assert len(sample_points) == 33, f"expected 33 base samples, got {len(sample_points)}"
          axes = root.find(".//svg:path[@id='cartesian-plane-axes']", ns)
          assert axes is not None, "Cartesian axes are missing"
          assert axes.attrib.get("d") == "M33.333 0V56.25M0 37.5H100", "origin axes are not centered at (0, 0)"
          curves = {node.attrib.get("id") for node in root.findall(".//svg:polyline", ns)}
          expected = {"curve-base", "curve-vertical-translation",
                      "curve-horizontal-translation", "curve-scaled-reflected"}
          assert curves == expected, f"transformation curves differ: {curves}"
          text = " ".join(node.text or "" for node in root.findall(".//svg:text", ns))
          for formula in ("f(x) = x²", "f(x) + 0.5", "f(x + 0.5)", "a = -0.5"):
              assert formula in text, f"missing formula label: {formula}"
          print("Verified coordinate origin, 33 samples, four transformation curves, and formula labels.")
          PY

      - name: Upload GUI.SVG coordinate transformations lesson
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned commit SHA
        with:
          name: gui-svg-coordinate-transformations
          path: ./artifacts/02-coordinate-functions.generated.svg
          if-no-files-found: error

      - name: Fetch pinned Physics projectile run record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./artifacts
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/TrentBest/TheSingularityWorkshop.Physics/fc537e527a1590fbc4c18c39a4e2ad936b7e8ed3/docs/experiments/projectile-trajectory.run.json" \
            --output ./artifacts/physics-projectile-trajectory.run.json

      - name: Generate GUI.SVG projectile trajectory from Physics run record
        run: dotnet run --project samples/demonstrations/ProjectileTrajectory/ProjectileTrajectory.csproj --configuration Release -- ./artifacts/physics-projectile-trajectory.run.json ./artifacts/03-projectile-trajectory.generated.svg

      - name: Upload Physics-backed GUI.SVG projectile trajectory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned commit SHA
        with:
          name: gui-svg-physics-projectile-trajectory
          path: ./artifacts/03-projectile-trajectory.generated.svg
          if-no-files-found: error

      - name: Checkout pinned Physics source for seeded point-set run record
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned commit SHA
        with:
          repository: TrentBest/TheSingularityWorkshop.Physics
          ref: eea463a5034682b8eb149bd73013ac7dd590eb83
          path: ./artifacts/physics-source

      - name: Export actual Physics seeded point-set run record
        run: dotnet run --project ./artifacts/physics-source/samples/SeededPointSet2dExport/SeededPointSet2dExport.csproj --configuration Release -- ./artifacts/physics-seeded-point-set-2d.run.json

      - name: Render and verify Physics seeded point-set with GUI.SVG
        run: dotnet run --project samples/demonstrations/SeededPointSet2d/SeededPointSet2d.csproj --configuration Release -- ./artifacts/physics-seeded-point-set-2d.run.json ./artifacts/05-seeded-point-set.generated.svg

      - name: Upload Physics-backed GUI.SVG seeded point set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned commit SHA
        with:
          name: gui-svg-physics-seeded-point-set
          path: |
            ./artifacts/physics-seeded-point-set-2d.run.json
            ./artifacts/05-seeded-point-set.generated.svg
          if-no-files-found: error

      - name: Pack Core
        run: dotnet pack src/Core/TheSingularityWorkshop.GUI.Core.csproj --configuration Release --output ./packages

      - name: Pack Blazor
        run: dotnet pack src/Blazor/TheSingularityWorkshop.GUI.Blazor.csproj --configuration Release --output ./packages

      - name: Pack SVG
        run: dotnet pack src/SVG/TheSingularityWorkshop.GUI.SVG.csproj --configuration Release --output ./packages

      - name: Pack WPF
        run: dotnet pack src/WPF/TheSingularityWorkshop.GUI.WPF.csproj --configuration Release -p:EnableWindowsTargeting=true --output ./packages

      - name: Verify Core and Blazor package README metadata
        shell: bash
        run: |
          set -euo pipefail
          for id in TheSingularityWorkshop.GUI.Core TheSingularityWorkshop.GUI.Blazor; do
            package="$(find ./packages -maxdepth 1 -type f -name "${id}.*.nupkg" -print -quit)"
            test -n "$package" && test -s "$package"
            unzip -l "$package" | grep -q 'README.md'
            nuspec="$(unzip -Z1 "$package" | grep -E '[.]nuspec$' | head -n 1)"
            test -n "$nuspec"
            unzip -p "$package" "$nuspec" | grep -q '<readme>README.md</readme>'
          done

      - name: Verify all package license, README, target framework, and XML documentation metadata
        shell: bash
        run: |
          set -euo pipefail
          for id in TheSingularityWorkshop.GUI.Core TheSingularityWorkshop.GUI.Blazor TheSingularityWorkshop.GUI.WPF TheSingularityWorkshop.GUI.SVG; do
            package="$(find ./packages -maxdepth 1 -type f -name "${id}.*.nupkg" -print -quit)"
            test -n "$package" && test -s "$package"
            nuspec="$(unzip -Z1 "$package" | grep -E '[.]nuspec$' | head -n 1)"
            test -n "$nuspec"
            metadata="$(unzip -p "$package" "$nuspec")"
            entries="$(unzip -Z1 "$package")"
            grep -q '<license type="expression">MIT</license>' <<< "$metadata"
            grep -q '<readme>README.md</readme>' <<< "$metadata"
            grep -Fxq 'README.md' <<< "$entries"
            if [[ "$id" == "TheSingularityWorkshop.GUI.WPF" ]]; then
              tfm="net8.0-windows7.0"
            else
              tfm="net8.0"
            fi
            grep -Fq "lib/$tfm/" <<< "$entries"
            grep -E -q "^lib/$tfm/[^/]+[.]dll$" <<< "$entries"
            grep -E -q "^lib/$tfm/[^/]+[.]xml$" <<< "$entries"
          done

      - name: Verify GUI.SVG package documentation and gallery
        shell: bash
        run: |
          set -euo pipefail
          package="$(find ./packages -maxdepth 1 -type f -name 'TheSingularityWorkshop.GUI.SVG.*.nupkg' -print -quit)"
          test -n "$package" && test -s "$package"
          unzip -l "$package" > ./artifacts/gui-svg-package-contents.txt
          grep -q 'README.md' ./artifacts/gui-svg-package-contents.txt
          grep -q 'docs/SVG_ADAPTER.md' ./artifacts/gui-svg-package-contents.txt
          grep -q 'docs/assets/svg-adapter-gallery.svg' ./artifacts/gui-svg-package-contents.txt

      - name: Verify clean consumer can restore and use packed packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./artifacts/gui-clean-consumer
          core_package="$(find ./packages -maxdepth 1 -type f -name 'TheSingularityWorkshop.GUI.Core.*.nupkg' -print -quit)"
          blazor_package="$(find ./packages -maxdepth 1 -type f -name 'TheSingularityWorkshop.GUI.Blazor.*.nupkg' -print -quit)"
          svg_package="$(find ./packages -maxdepth 1 -type f -name 'TheSingularityWorkshop.GUI.SVG.*.nupkg' -print -quit)"
          test -n "$core_package" && test -n "$blazor_package" && test -n "$svg_package"
          core_version="$(basename "$core_package" .nupkg)"
          core_version="${core_version#TheSingularityWorkshop.GUI.Core.}"
          blazor_version="$(basename "$blazor_package" .nupkg)"
          blazor_version="${blazor_version#TheSingularityWorkshop.GUI.Blazor.}"
          svg_version="$(basename "$svg_package" .nupkg)"
          svg_version="${svg_version#TheSingularityWorkshop.GUI.SVG.}"
          cat > ./artifacts/gui-clean-consumer/Consumer.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="TheSingularityWorkshop.GUI.Core" Version="${core_version}" />
              <PackageReference Include="TheSingularityWorkshop.GUI.Blazor" Version="${blazor_version}" />
              <PackageReference Include="TheSingularityWorkshop.GUI.SVG" Version="${svg_version}" />
            </ItemGroup>
          </Project>
          EOF
          cat > ./artifacts/gui-clean-consumer/Program.cs <<'EOF'
          using TheSingularityWorkshop.Workshop.Gui;
          using TheSingularityWorkshop.Workshop.Gui.Svg;

          var tree = GuiBuilder.Create("Panel", "root")
              .Child("Button", "save", button => button.Text("Save"))
              .Build();
          _ = BlazorGuiRenderer.Render(tree);

          var scene = GuiBuilder.Create("svg-scene", "scene")
              .Child("svg-circle", "marker", marker => marker
                  .Property("cx", "50").Property("cy", "50").Property("r", "4"))
              .Build();
          var svg = new SvgGuiRenderer().Render(scene);
          if (!svg.Contains("<svg", StringComparison.Ordinal))
              throw new InvalidOperationException("SVG package did not emit an SVG document.");
          Console.WriteLine("Clean package consumer passed.");
          EOF
          dotnet restore ./artifacts/gui-clean-consumer/Consumer.csproj --source ./packages --source https://api.nuget.org/v3/index.json
          dotnet run --project ./artifacts/gui-clean-consumer/Consumer.csproj --configuration Release --no-restore
      - name: Upload NuGet package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned commit SHA
        with:
          name: gui-nuget-packages
          path: ./packages/*.nupkg
          if-no-files-found: error

  test-wpf:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned commit SHA

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # pinned commit SHA
        with:
          dotnet-version: 8.0.x

      - name: Test WPF renderer
        run: dotnet test tests/WPF.Tests/TheSingularityWorkshop.GUI.WPF.Tests.csproj --configuration Release

      - name: Pack Core and WPF for archive-only consumer verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path ./packages, ./artifacts/wpf-package-consumer | Out-Null
          dotnet pack src/Core/TheSingularityWorkshop.GUI.Core.csproj --configuration Release --output ./packages
          if ($LASTEXITCODE -ne 0) { throw "Core package creation failed." }
          dotnet pack src/WPF/TheSingularityWorkshop.GUI.WPF.csproj --configuration Release -p:EnableWindowsTargeting=true --output ./packages
          if ($LASTEXITCODE -ne 0) { throw "WPF package creation failed." }
          $corePackage = Get-ChildItem ./packages/TheSingularityWorkshop.GUI.Core.*.nupkg | Select-Object -First 1
          $wpfPackage = Get-ChildItem ./packages/TheSingularityWorkshop.GUI.WPF.*.nupkg | Select-Object -First 1
          if (-not $corePackage -or -not $wpfPackage) { throw "Core or WPF package archive is missing." }
          $coreVersion = $corePackage.BaseName.Substring("TheSingularityWorkshop.GUI.Core.".Length)
          $wpfVersion = $wpfPackage.BaseName.Substring("TheSingularityWorkshop.GUI.WPF.".Length)
          $projectContent = @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWPF>true</UseWPF>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="TheSingularityWorkshop.GUI.Core" Version="$coreVersion" />
              <PackageReference Include="TheSingularityWorkshop.GUI.WPF" Version="$wpfVersion" />
            </ItemGroup>
          </Project>
          "@
          $projectContent | Set-Content -Encoding utf8 ./artifacts/wpf-package-consumer/Consumer.csproj
          $programContent = @"
          using System;
          using System.Windows;
          using System.Windows.Controls;
          using TheSingularityWorkshop.Workshop.Gui;
          using TheSingularityWorkshop.GUI.WPF;

          internal static class Program
          {
              [STAThread]
              private static int Main()
              {
                  var tree = GuiBuilder.Create("Panel", "root")
                      .Child("Button", "save", button => button.Text("Save"))
                      .Build();
                  var rendered = WpfGuiRenderer.Render(tree);
                  if (rendered is not Border)
                      throw new InvalidOperationException("WPF package did not render the root panel as a Border.");
                  Console.WriteLine("WPF archive-only consumer passed.");
                  return 0;
              }
          }
          "@
          $programContent | Set-Content -Encoding utf8 ./artifacts/wpf-package-consumer/Program.cs
          $packageSource = (Resolve-Path ./packages).Path
          # Restore exclusively from packed Core/WPF archives: this proves the consumer has no repository project references or external package-feed fallback.
          dotnet restore ./artifacts/wpf-package-consumer/Consumer.csproj --source $packageSource
          if ($LASTEXITCODE -ne 0) { throw "WPF package-only consumer restore failed." }
          dotnet run --project ./artifacts/wpf-package-consumer/Consumer.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "WPF package-only consumer failed." }

  publish_nuget:
    needs:
      - test-and-package
      - test-wpf
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && false }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pinned commit SHA
        with:
          name: gui-nuget-packages
          path: ./packages

      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # pinned commit SHA
        id: login
        with:
          user: TheSingularityWorkshop

      - name: Publish packages to NuGet.org
        run: dotnet nuget push "./packages/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

name: Package GUI

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Core
        run: dotnet restore src/Core/TheSingularityWorkshop.GUI.Core.csproj

      - name: Restore Blazor
        run: dotnet restore src/Blazor/TheSingularityWorkshop.GUI.Blazor.csproj

      - name: Test Core
        run: dotnet test tests/Core.Tests/TheSingularityWorkshop.GUI.Core.Tests.csproj --configuration Release

      - name: Test Blazor
        run: dotnet test tests/Blazor.Tests/TheSingularityWorkshop.GUI.Blazor.Tests.csproj --configuration Release

      - name: Pack Core
        run: dotnet pack src/Core/TheSingularityWorkshop.GUI.Core.csproj --configuration Release --output ./packages

      - name: Pack Blazor
        run: dotnet pack src/Blazor/TheSingularityWorkshop.GUI.Blazor.csproj --configuration Release --output ./packages

      - name: Publish packages to NuGet.org
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: dotnet nuget push "./packages/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate

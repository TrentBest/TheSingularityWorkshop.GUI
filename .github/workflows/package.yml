name: Package GUI

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the packed packages to NuGet.org"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore Core
        run: dotnet restore src/Core/TheSingularityWorkshop.GUI.Core.csproj

      - name: Restore Blazor
        run: dotnet restore src/Blazor/TheSingularityWorkshop.GUI.Blazor.csproj

      - name: Test Core with coverage
        run: dotnet test tests/Core.Tests/TheSingularityWorkshop.GUI.Core.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults/Core

      - name: Test Blazor with coverage
        run: dotnet test tests/Blazor.Tests/TheSingularityWorkshop.GUI.Blazor.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults/Blazor

      # Coverage is part of the normal quality gate; the repository secret is supplied by GitHub Actions.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./TestResults/**/coverage.cobertura.xml
          fail_ci_if_error: true

      - name: Pack Core
        run: dotnet pack src/Core/TheSingularityWorkshop.GUI.Core.csproj --configuration Release --output ./packages

      - name: Pack Blazor
        run: dotnet pack src/Blazor/TheSingularityWorkshop.GUI.Blazor.csproj --configuration Release --output ./packages

      - name: Upload NuGet packages as artifact
        uses: actions/upload-artifact@v7
        with:
          name: gui-nuget-packages
          path: ./packages/*.nupkg

  publish_nuget:
    needs: test-and-package
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: gui-nuget-packages
          path: ./packages

      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: TheSingularityWorkshop

      - name: Publish packages to NuGet.org
        run: dotnet nuget push "./packages/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

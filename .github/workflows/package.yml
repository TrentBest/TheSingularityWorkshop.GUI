name: Package GUI

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-core:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore Core
        run: dotnet restore src/Core/TheSingularityWorkshop.GUI.Core.csproj

      - name: Test Core with coverage
        run: dotnet test tests/Core.Tests/TheSingularityWorkshop.GUI.Core.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults/Core

      # Coverage is part of the normal quality gate; the repository secret is supplied by GitHub Actions.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./TestResults/Core/coverage.cobertura.xml
          fail_ci_if_error: true

      - name: Pack Core
        run: dotnet pack src/Core/TheSingularityWorkshop.GUI.Core.csproj --configuration Release --output ./packages --no-restore

      - name: Upload Core package
        uses: actions/upload-artifact@v7
        with:
          name: gui-nuget-package-core
          path: ./packages/*.nupkg

  build-blazor:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore Blazor
        run: dotnet restore src/Blazor/TheSingularityWorkshop.GUI.Blazor.csproj

      - name: Test Blazor with coverage
        run: dotnet test tests/Blazor.Tests/TheSingularityWorkshop.GUI.Blazor.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults/Blazor

      - name: Pack Blazor
        run: dotnet pack src/Blazor/TheSingularityWorkshop.GUI.Blazor.csproj --configuration Release --output ./packages --no-restore

      - name: Upload Blazor package
        uses: actions/upload-artifact@v7
        with:
          name: gui-nuget-package-blazor
          path: ./packages/*.nupkg

  build-wpf:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore WPF
        run: dotnet restore src/WPF/TheSingularityWorkshop.GUI.WPF.csproj

      - name: Build WPF
        run: dotnet build src/WPF/TheSingularityWorkshop.GUI.WPF.csproj --configuration Release --no-restore

      # WPF tests will be added to this Windows quality lane once tests/WPF.Tests exists.
      - name: Pack WPF
        run: dotnet pack src/WPF/TheSingularityWorkshop.GUI.WPF.csproj --configuration Release --output ./packages --no-build

      - name: Upload WPF package
        uses: actions/upload-artifact@v7
        with:
          name: gui-nuget-package-wpf
          path: ./packages/*.nupkg

  publish_nuget_core:
    needs: build-core
    runs-on: ubuntu-24.04
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && false }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Core package
        uses: actions/download-artifact@v8
        with:
          name: gui-nuget-package-core
          path: ./packages

      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: TheSingularityWorkshop

      - name: Publish Core package to NuGet.org
        run: dotnet nuget push "./packages/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

  publish_nuget_blazor:
    needs: build-blazor
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Blazor package
        uses: actions/download-artifact@v8
        with:
          name: gui-nuget-package-blazor
          path: ./packages

      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: TheSingularityWorkshop

      - name: Publish Blazor package to NuGet.org
        run: dotnet nuget push "./packages/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

  publish_nuget_wpf:
    needs: build-wpf
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download WPF package
        uses: actions/download-artifact@v8
        with:
          name: gui-nuget-package-wpf
          path: ./packages

      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: TheSingularityWorkshop

      - name: Publish WPF package to NuGet.org
        run: dotnet nuget push "./packages/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

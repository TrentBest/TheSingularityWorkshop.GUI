name: Package GUI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified GUI packages to NuGet.org"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository-local documentation links
        run: python3 scripts/check-doc-links.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Core
        run: dotnet restore src/Core/TheSingularityWorkshop.GUI.Core.csproj

      - name: Restore Blazor
        run: dotnet restore src/Blazor/TheSingularityWorkshop.GUI.Blazor.csproj

      - name: Restore SVG
        run: dotnet restore src/SVG/TheSingularityWorkshop.GUI.SVG.csproj

      - name: Restore adapter conformance tests
        run: dotnet restore tests/Adapter.Conformance.Tests/TheSingularityWorkshop.GUI.Adapter.Conformance.Tests.csproj

      - name: Test Core
        run: dotnet test tests/Core.Tests/TheSingularityWorkshop.GUI.Core.Tests.csproj --configuration Release

      - name: Test Blazor
        run: dotnet test tests/Blazor.Tests/TheSingularityWorkshop.GUI.Blazor.Tests.csproj --configuration Release

      - name: Test SVG
        run: dotnet test tests/SVG.Tests/TheSingularityWorkshop.GUI.SVG.Tests.csproj --configuration Release

      - name: Test shared adapter conformance
        run: dotnet test tests/Adapter.Conformance.Tests/TheSingularityWorkshop.GUI.Adapter.Conformance.Tests.csproj --configuration Release

      - name: Build WPF adapter
        run: dotnet build src/WPF/TheSingularityWorkshop.GUI.WPF.csproj --configuration Release -p:EnableWindowsTargeting=true

      - name: Generate GUI.SVG feature gallery
        run: dotnet run --project samples/SvgGallery/SvgGallery.csproj --configuration Release -- ./artifacts/svg-adapter-gallery.svg

      - name: Verify generated GUI.SVG gallery
        shell: bash
        run: |
          set -euo pipefail
          gallery="./artifacts/svg-adapter-gallery.svg"
          test -s "$gallery"
          grep -q '<linearGradient' "$gallery"
          grep -q '<clipPath' "$gallery"
          grep -q '<pattern' "$gallery"
          grep -q '<marker' "$gallery"
          grep -q '<filter' "$gallery"
          grep -q '<feTurbulence' "$gallery"
          grep -q '<feDisplacementMap' "$gallery"
          grep -q '<feComponentTransfer' "$gallery"
          grep -q '<feDiffuseLighting' "$gallery"
          grep -q '<feDistantLight' "$gallery"
          grep -q 'filter="url(#surface-relief)"' "$gallery"
          grep -q 'filter="url(#surface-lighting)"' "$gallery"
          grep -q '<use' "$gallery"
          grep -q '<a ' "$gallery"
          grep -q '<animate' "$gallery"
          grep -q '<mpath' "$gallery"
          grep -q '<set' "$gallery"
          grep -q 'aria-label="GUI.SVG manifestation gallery"' "$gallery"
          cmp "$gallery" ./docs/assets/svg-adapter-gallery.svg

      - name: Upload GUI.SVG feature gallery
        uses: actions/upload-artifact@v7
        with:
          name: gui-svg-feature-gallery
          path: ./artifacts/svg-adapter-gallery.svg
          if-no-files-found: error

      - name: Pack Core
        run: dotnet pack src/Core/TheSingularityWorkshop.GUI.Core.csproj --configuration Release --output ./packages

      - name: Pack Blazor
        run: dotnet pack src/Blazor/TheSingularityWorkshop.GUI.Blazor.csproj --configuration Release --output ./packages

      - name: Pack SVG
        run: dotnet pack src/SVG/TheSingularityWorkshop.GUI.SVG.csproj --configuration Release --output ./packages

      - name: Pack WPF
        run: dotnet pack src/WPF/TheSingularityWorkshop.GUI.WPF.csproj --configuration Release -p:EnableWindowsTargeting=true --output ./packages

      - name: Verify Core and Blazor package README metadata
        shell: bash
        run: |
          set -euo pipefail
          for id in TheSingularityWorkshop.GUI.Core TheSingularityWorkshop.GUI.Blazor; do
            package="$(find ./packages -maxdepth 1 -type f -name "${id}.*.nupkg" -print -quit)"
            test -n "$package" && test -s "$package"
            unzip -l "$package" | grep -q 'README.md'
            nuspec="$(unzip -Z1 "$package" | grep -E '[.]nuspec$' | head -n 1)"
            test -n "$nuspec"
            unzip -p "$package" "$nuspec" | grep -q '<readme>README.md</readme>'
          done

      - name: Verify all package license and README metadata
        shell: bash
        run: |
          set -euo pipefail
          for id in TheSingularityWorkshop.GUI.Core TheSingularityWorkshop.GUI.Blazor TheSingularityWorkshop.GUI.WPF TheSingularityWorkshop.GUI.SVG; do
            package="$(find ./packages -maxdepth 1 -type f -name "${id}.*.nupkg" -print -quit)"
            test -n "$package" && test -s "$package"
            nuspec="$(unzip -Z1 "$package" | grep -E '[.]nuspec$' | head -n 1)"
            test -n "$nuspec"
            metadata="$(unzip -p "$package" "$nuspec")"
            grep -q '<license type="expression">MIT</license>' <<< "$metadata"
            grep -q '<readme>README.md</readme>' <<< "$metadata"
            unzip -l "$package" | grep -q 'README.md'
          done

      - name: Verify GUI.SVG package documentation and gallery
        shell: bash
        run: |
          set -euo pipefail
          package="$(find ./packages -maxdepth 1 -type f -name 'TheSingularityWorkshop.GUI.SVG.*.nupkg' -print -quit)"
          test -n "$package" && test -s "$package"
          unzip -l "$package" > ./artifacts/gui-svg-package-contents.txt
          grep -q 'README.md' ./artifacts/gui-svg-package-contents.txt
          grep -q 'docs/SVG_ADAPTER.md' ./artifacts/gui-svg-package-contents.txt
          grep -q 'docs/assets/svg-adapter-gallery.svg' ./artifacts/gui-svg-package-contents.txt

      - name: Verify clean consumer can restore and use packed packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./artifacts/gui-clean-consumer
          core_package="$(find ./packages -maxdepth 1 -type f -name 'TheSingularityWorkshop.GUI.Core.*.nupkg' -print -quit)"
          blazor_package="$(find ./packages -maxdepth 1 -type f -name 'TheSingularityWorkshop.GUI.Blazor.*.nupkg' -print -quit)"
          svg_package="$(find ./packages -maxdepth 1 -type f -name 'TheSingularityWorkshop.GUI.SVG.*.nupkg' -print -quit)"
          test -n "$core_package" && test -n "$blazor_package" && test -n "$svg_package"
          core_version="$(basename "$core_package" .nupkg)"
          core_version="${core_version#TheSingularityWorkshop.GUI.Core.}"
          blazor_version="$(basename "$blazor_package" .nupkg)"
          blazor_version="${blazor_version#TheSingularityWorkshop.GUI.Blazor.}"
          svg_version="$(basename "$svg_package" .nupkg)"
          svg_version="${svg_version#TheSingularityWorkshop.GUI.SVG.}"
          cat > ./artifacts/gui-clean-consumer/Consumer.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="TheSingularityWorkshop.GUI.Core" Version="${core_version}" />
              <PackageReference Include="TheSingularityWorkshop.GUI.Blazor" Version="${blazor_version}" />
              <PackageReference Include="TheSingularityWorkshop.GUI.SVG" Version="${svg_version}" />
            </ItemGroup>
          </Project>
          EOF
          cat > ./artifacts/gui-clean-consumer/Program.cs <<'EOF'
          using TheSingularityWorkshop.Workshop.Gui;
          using TheSingularityWorkshop.Workshop.Gui.Svg;

          var tree = GuiBuilder.Create("Panel", "root")
              .Child("Button", "save", button => button.Text("Save"))
              .Build();
          _ = BlazorGuiRenderer.Render(tree);

          var scene = GuiBuilder.Create("svg-scene", "scene")
              .Child("svg-circle", "marker", marker => marker
                  .Property("cx", "50").Property("cy", "50").Property("r", "4"))
              .Build();
          var svg = new SvgGuiRenderer().Render(scene);
          if (!svg.Contains("<svg", StringComparison.Ordinal))
              throw new InvalidOperationException("SVG package did not emit an SVG document.");
          Console.WriteLine("Clean package consumer passed.");
          EOF
          dotnet restore ./artifacts/gui-clean-consumer/Consumer.csproj --source ./packages --source https://api.nuget.org/v3/index.json
          dotnet run --project ./artifacts/gui-clean-consumer/Consumer.csproj --configuration Release --no-restore
      - name: Upload NuGet package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gui-nuget-packages
          path: ./packages/*.nupkg
          if-no-files-found: error

  test-wpf:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test WPF renderer
        run: dotnet test tests/WPF.Tests/TheSingularityWorkshop.GUI.WPF.Tests.csproj --configuration Release

  publish_nuget:
    needs:
      - test-and-package
      - test-wpf
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && false }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet package artifacts
        uses: actions/download-artifact@v8
        with:
          name: gui-nuget-packages
          path: ./packages

      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: TheSingularityWorkshop

      - name: Publish packages to NuGet.org
        run: dotnet nuget push "./packages/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

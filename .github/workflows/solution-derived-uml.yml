name: Solution-derived UML inventory

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solution-uml:
    # Reflection.GetTypes() must be able to load the WPF assembly and WindowsDesktop references.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate, build, and reconcile all maintained product projects
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/generate_solution_uml.py
      - name: Upload solution-level UML inventory
        uses: actions/upload-artifact@v7
        with:
          name: solution-derived-uml-inventory
          path: artifacts/solution-uml/
          if-no-files-found: error

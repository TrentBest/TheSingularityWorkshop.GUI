name: Solution-derived UML inventory

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solution-uml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Generate and verify all maintained product projects
        run: SOURCE_REVISION="$GITHUB_SHA" python3 scripts/generate_solution_uml.py
      - name: Upload solution-level UML inventory
        uses: actions/upload-artifact@v7
        with:
          name: solution-derived-uml-inventory
          path: artifacts/solution-uml/
          if-no-files-found: error

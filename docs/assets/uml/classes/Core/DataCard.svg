<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">UML ecosystem class diagram: DataCard</title>
  <desc id="desc">DataCard is the focal sealed class, outlined in brilliant blue. Its verified direct consumer SvgDataCardRenderer is above. API input types are shown to the left; implementation dependencies are below; .NET base-library provenance is shown at the right. No arbitrary relationship lines are used: position and labels convey the documented roles. DataCard has one private readonly child collection, a public constructor, seven properties, and GetCollapsedSummary. It declares no base class or implemented interface.</desc>

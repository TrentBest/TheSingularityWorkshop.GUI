<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Workshop target-centered UML neighborhood for GuiBuilder</title>
  <desc id="desc">Manually authored, source-reviewed static diagram. GuiBuilders, CoordinateSystemGuiBuilder, and the Core test harness appear above the focal GuiBuilder class. GuiNode and the private nested NodeBuilder appear below as output and implementation dependencies. .NET base-library types appear to the right. Colored type-conduit stubs identify semantic type identities; the receiving endpoint is rotated 180 degrees. The diagram is not interactive and does not show runtime execution.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a00"/></marker>
    <style>
      .card { stroke-width: 4; rx: 5; }
      .heading { font-family: Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .kind { font-family: Segoe UI, Arial, sans-serif; font-size: 12px; font-weight: 700; }
      .body { font-family: Segoe UI, Arial, sans-serif; font-size: 14px; }
      .small { font-family: Segoe UI, Arial, sans-serif; font-size: 12px; }
      .relation { fill: none; stroke: #ff7a00; stroke-width: 2.5; }
      .port { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="818" fill="#fffaf4" stroke="#ff7a00" stroke-width="2"/>
  <text x="30" y="32" class="small" fill="#6b2e0c">WORKSHOP UML · TARGET-CENTERED NEIGHBORHOOD · STATIC SOURCE-REVIEWED VIEW</text>

  <!-- Verified consumers / callers -->
  <g id="consumer-guibuilders" data-type-id="TheSingularityWorkshop.Workshop.Gui.GuiBuilders">
    <rect class="card" x="35" y="65" width="300" height="125" fill="#e8f7eb" stroke="#52e05a"/>
    <text x="55" y="91" class="kind" fill="#155b21">«static class»</text>
    <text x="55" y="118" class="heading" fill="#123b1a">GuiBuilders</text>
    <text x="55" y="145" class="body" fill="#123b1a">Convenience factory</text>
    <text x="55" y="166" class="small" fill="#123b1a">Creates Panel / Button / Text builders</text>
  </g>
  <g id="consumer-coordinate-builder" data-type-id="TheSingularityWorkshop.Workshop.Gui.CoordinateSystemGuiBuilder">
    <rect class="card" x="450" y="65" width="300" height="125" fill="#e8f7eb" stroke="#52e05a"/>
    <text x="470" y="91" class="kind" fill="#155b21">«class»</text>
    <text x="470" y="118" class="heading" fill="#123b1a">CoordinateSystemGuiBuilder</text>
    <text x="470" y="145" class="body" fill="#123b1a">Builds coordinate-space nodes</text>
    <text x="470" y="166" class="small" fill="#123b1a">Delegates to GuiBuilder</text>
  </g>
  <g id="consumer-tests" data-type-id="TheSingularityWorkshop.GUI.Core.Tests.GuiBuilderTests">
    <rect class="card" x="865" y="65" width="300" height="125" fill="#e8f7eb" stroke="#52e05a"/>
    <text x="885" y="91" class="kind" fill="#155b21">«test class»</text>
    <text x="885" y="118" class="heading" fill="#123b1a">GuiBuilderTests</text>
    <text x="885" y="145" class="body" fill="#123b1a">Verifies tree composition</text>
    <text x="885" y="166" class="small" fill="#123b1a">Snapshot, commands, deep trees</text>
  </g>

  <!-- Target -->
  <g id="focus-guibuilder" data-type-id="TheSingularityWorkshop.Workshop.Gui.GuiBuilder">
    <rect class="card" x="405" y="270" width="390" height="170" fill="#172b3a" stroke="#ff7a00" stroke-width="6"/>
    <text x="430" y="299" class="kind" fill="#ffd34d">«sealed class» · FOCAL TYPE</text>
    <text x="430" y="333" class="heading" font-size="24" fill="#ffffff">GuiBuilder</text>
    <text x="430" y="361" class="body" fill="#f0f6fb">Platform-neutral fluent builder</text>
    <text x="430" y="385" class="body" fill="#f0f6fb">Composes a recursive semantic tree</text>
    <text x="430" y="410" class="small" fill="#b7c8d5">Build() → immutable GuiNode snapshot</text>
    <a href="../../../../api/Core/GuiBuilder.md" aria-label="Open the GuiBuilder type reference">
      <rect x="675" y="283" width="100" height="28" rx="4" fill="#ff7a00"/>
      <text x="725" y="302" text-anchor="middle" class="small" fill="#172b3a">Type details ↗</text>
    </a>
  </g>

  <!-- Direct callers enter from above -->
  <path class="relation" d="M185 190 L185 222 L480 222 L480 270" marker-end="url(#arrow-orange)"/>
  <text x="330" y="215" text-anchor="middle" class="small" fill="#6b2e0c">factory calls Create</text>
  <path class="relation" d="M600 190 L600 270" marker-end="url(#arrow-orange)"/>
  <text x="615" y="235" class="small" fill="#6b2e0c">delegates to builder</text>
  <path class="relation" d="M1015 190 L1015 230 L720 230 L720 270" marker-end="url(#arrow-orange)"/>
  <text x="880" y="223" text-anchor="middle" class="small" fill="#6b2e0c">tests the public contract</text>

  <!-- Dependencies and results below -->
  <g id="dependency-guinode" data-type-id="TheSingularityWorkshop.Workshop.Gui.GuiNode">
    <rect class="card" x="260" y="555" width="330" height="130" fill="#e4f5ff" stroke="#00a8ff"/>
    <text x="280" y="582" class="kind" fill="#005780">«sealed class» · RESULT</text>
    <text x="280" y="611" class="heading" fill="#123b52">GuiNode</text>
    <text x="280" y="638" class="body" fill="#123b52">Immutable semantic snapshot</text>
    <text x="280" y="661" class="small" fill="#123b52">Ordered children and string properties</text>
  </g>
  <g id="dependency-nodebuilder" data-type-id="TheSingularityWorkshop.Workshop.Gui.GuiBuilder.NodeBuilder">
    <rect class="card" x="635" y="555" width="330" height="130" fill="#fce8fa" stroke="#ff2cff"/>
    <text x="655" y="582" class="kind" fill="#75116f">«private nested class»</text>
    <text x="655" y="611" class="heading" fill="#51104d">NodeBuilder</text>
    <text x="655" y="638" class="body" fill="#51104d">Mutable construction state</text>
    <text x="655" y="661" class="small" fill="#51104d">Not exposed as public API</text>
  </g>
  <path d="M505 440 L505 555" fill="none" stroke="#00a8ff" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="515" y="500" class="small" fill="#005780">Build() returns</text>
  <path d="M695 440 L695 555" fill="none" stroke="#ff2cff" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="705" y="500" class="small" fill="#75116f">owns / traverses</text>

  <!-- External runtime references -->
  <g id="external-dotnet" data-type-id="framework:net8.0:BCL">
    <rect class="card" x="930" y="300" width="235" height="145" fill="#fff2cc" stroke="#ffd34d"/>
    <text x="950" y="327" class="kind" fill="#765800">«framework»</text>
    <text x="950" y="354" class="heading" fill="#4f3d00">.NET 8 BCL</text>
    <text x="950" y="382" class="body" fill="#4f3d00">System.Action</text>
    <text x="950" y="404" class="body" fill="#4f3d00">Collections / Stack</text>
    <text x="950" y="426" class="small" fill="#4f3d00">Framework types, not NuGet packages</text>
  </g>
  <path d="M795 355 L930 355" fill="none" stroke="#ffd34d" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="862" y="345" text-anchor="middle" class="small" fill="#765800">uses runtime types</text>

  <!-- Type conduit ports: matching identity uses the same palette token. -->
  <g data-owner-type-id="TheSingularityWorkshop.Workshop.Gui.GuiBuilder" data-type-id="TheSingularityWorkshop.Workshop.Gui.GuiNode" transform="rotate(0)">
    <title>GuiNode type conduit source endpoint</title>
    <path class="port" d="M496 440 L512 440 L512 448" stroke="#00a8ff"/>
  </g>
  <g data-owner-type-id="TheSingularityWorkshop.Workshop.Gui.GuiNode" data-type-id="TheSingularityWorkshop.Workshop.Gui.GuiNode" transform="rotate(180 505 555)">
    <title>GuiNode type conduit receiving endpoint, rotated 180 degrees</title>
    <path class="port" d="M497 555 L513 555 L513 563" stroke="#00a8ff"/>
  </g>
  <g data-owner-type-id="TheSingularityWorkshop.Workshop.Gui.GuiBuilder" data-type-id="TheSingularityWorkshop.Workshop.Gui.GuiBuilder.NodeBuilder" transform="rotate(0)">
    <title>NodeBuilder type conduit source endpoint</title>
    <path class="port" d="M686 440 L702 440 L702 448" stroke="#ff2cff"/>
  </g>
  <g data-owner-type-id="TheSingularityWorkshop.Workshop.Gui.GuiBuilder.NodeBuilder" data-type-id="TheSingularityWorkshop.Workshop.Gui.GuiBuilder.NodeBuilder" transform="rotate(180 695 555)">
    <title>NodeBuilder type conduit receiving endpoint, rotated 180 degrees</title>
    <path class="port" d="M687 555 L703 555 L703 563" stroke="#ff2cff"/>
  </g>
  <g data-owner-type-id="TheSingularityWorkshop.Workshop.Gui.GuiBuilder" data-type-id="framework:net8.0:BCL" transform="rotate(0)">
    <title>.NET base-library type conduit source endpoint</title>
    <path class="port" d="M795 352 L803 352 L803 368" stroke="#ffd34d"/>
  </g>
  <g data-owner-type-id="framework:net8.0:BCL" data-type-id="framework:net8.0:BCL" transform="rotate(180 930 360)">
    <title>.NET base-library type conduit receiving endpoint, rotated 180 degrees</title>
    <path class="port" d="M930 352 L938 352 L938 368" stroke="#ffd34d"/>
  </g>

  <text x="30" y="745" class="body" fill="#6b2e0c">Reading order: consumers above → focal contract → outputs / implementation dependencies below → framework references right.</text>
  <text x="30" y="773" class="small" fill="#6b2e0c">Static SVG · manually authored and source-reviewed · relationships are not a runtime trace · colors are reinforced by labels and type identities.</text>
</svg>

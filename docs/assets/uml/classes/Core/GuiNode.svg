<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" role="img" aria-labelledby="title desc">
  <title id="title">UML class diagram: GuiNode</title>
  <desc id="desc">GuiNode is a sealed immutable model node. It exposes kind, ID, optional text and source, read-only properties, ordered child nodes, and Find and TryFind traversal methods.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #172b3a; }
    .head { fill: #172b3a; }
    .headtext { fill: #f0f6fb; font-size: 18px; font-weight: 700; }
    .stereotype { fill: #b7c8d5; font-size: 12px; }
    .panel { fill: #f7fafc; stroke: #397d75; stroke-width: 2; }
    .section { stroke: #397d75; stroke-width: 1.2; }
  </style>
  <rect x="20" y="20" width="660" height="280" rx="8" class="panel"/>
  <rect x="20" y="20" width="660" height="60" rx="8" class="head"/>
  <rect x="20" y="68" width="660" height="12" class="head"/>
  <text x="350" y="42" text-anchor="middle" class="stereotype">«sealed immutable model»</text>
  <text x="350" y="65" text-anchor="middle" class="headtext">GuiNode</text>
  <line x1="20" y1="80" x2="680" y2="80" class="section"/>
  <text x="42" y="105" font-weight="700">Properties</text>
  <text x="42" y="129">+ Kind : string {get}</text>
  <text x="42" y="151">+ Id : string {get}</text>
  <text x="42" y="173">+ Text : string? {get}</text>
  <text x="42" y="195">+ Source : string? {get}</text>
  <text x="42" y="217">+ Properties : IReadOnlyDictionary&lt;string,string&gt; {get}</text>
  <text x="42" y="239">+ Children : IReadOnlyList&lt;GuiNode&gt; {get}</text>
  <line x1="20" y1="250" x2="680" y2="250" class="section"/>
  <text x="42" y="274" font-weight="700">Methods</text>
  <text x="160" y="274">+ Find(id : string) : GuiNode</text>
  <text x="390" y="274">+ TryFind(id : string, out node) : bool</text>
</svg>
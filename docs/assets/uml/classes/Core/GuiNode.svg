<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">UML class diagram: GuiNode</title>
  <desc id="desc">GuiNode is a sealed class with a private read-only child collection, a constructor that snapshots properties and children, six public read-only properties, and Find and TryFind depth-first traversal methods. Children are ordered GuiNode instances.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #172b3a; }
    .head { fill: #172b3a; }
    .headtext { fill: #f0f6fb; font-size: 18px; font-weight: 700; }
    .stereotype { fill: #b7c8d5; font-size: 12px; }
    .panel { fill: #f7fafc; stroke: #397d75; stroke-width: 2; }
    .section { stroke: #397d75; stroke-width: 1.2; }
  </style>
  <rect x="20" y="20" width="720" height="430" rx="8" class="panel"/>
  <rect x="20" y="20" width="720" height="60" rx="8" class="head"/>
  <rect x="20" y="68" width="720" height="12" class="head"/>
  <text x="380" y="42" text-anchor="middle" class="stereotype">«sealed class»</text>
  <text x="380" y="65" text-anchor="middle" class="headtext">GuiNode</text>
  <line x1="20" y1="80" x2="740" y2="80" class="section"/>
  <text x="42" y="105" font-weight="700">Fields</text>
  <text x="42" y="129">− _children : ReadOnlyCollection&lt;GuiNode&gt; {readOnly}</text>
  <line x1="20" y1="145" x2="740" y2="145" class="section"/>
  <text x="42" y="170" font-weight="700">Constructor</text>
  <text x="42" y="194">+ GuiNode(kind : string, id : string, text : string? = null, source : string? = null,</text>
  <text x="62" y="216">properties : IReadOnlyDictionary&lt;string,string&gt;? = null, children : IEnumerable&lt;GuiNode&gt;? = null)</text>
  <line x1="20" y1="232" x2="740" y2="232" class="section"/>
  <text x="42" y="257" font-weight="700">Properties</text>
  <text x="42" y="281">+ Kind : string {get}</text>
  <text x="42" y="303">+ Id : string {get}</text>
  <text x="42" y="325">+ Text : string? {get}</text>
  <text x="42" y="347">+ Source : string? {get}</text>
  <text x="42" y="369">+ Properties : IReadOnlyDictionary&lt;string,string&gt; {get}</text>
  <text x="42" y="391">+ Children : IReadOnlyList&lt;GuiNode&gt; {get}</text>
  <line x1="20" y1="405" x2="740" y2="405" class="section"/>
  <text x="42" y="430" font-weight="700">+ Find(id : string) : GuiNode</text>
  <text x="370" y="430" font-weight="700">+ TryFind(id : string, out node) : bool</text>
</svg>

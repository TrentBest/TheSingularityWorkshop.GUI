<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">It's the weekend. What are you building?</title>
  <desc id="desc">An animated, welcoming maker-world. Weekend invitation lettering glows and fades into a question while colorful ideas, a tiny rocket, robot, game controller, growing plant, sparks and a moving conveyor bring the workshop to life.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b35"/><stop offset=".52" stop-color="#20204a"/><stop offset="1" stop-color="#102f42"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#263d5b"/><stop offset="1" stop-color="#14263e"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a7ffe1"/><stop offset="1" stop-color="#35c9b0"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b8"/><stop offset="1" stop-color="#ff9b70"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e0c8ff"/><stop offset="1" stop-color="#9277ef"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a7eaff"/><stop offset="1" stop-color="#4c9de7"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#66e9d0" stop-opacity=".34"/><stop offset="1" stop-color="#66e9d0" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#050d20" flood-opacity=".4"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#a9d9eb" opacity=".18"/></pattern>
    <g id="spark" stroke="#fff0b8" stroke-width="3" stroke-linecap="round"><path d="M0-10V10M-10 0H10"/></g>
    <g id="gear" fill="none" stroke="#a7ffe1" stroke-width="5"><circle r="22"/><circle r="7"/><path d="M0-33V-23M0 23V33M-33 0H-23M23 0H33M-23-23L-16-16M16 16L23 23M23-23L16-16M-16 16L-23 23"/></g>
  </defs>

  <rect width="1200" height="620" rx="34" fill="url(#night)"/>
  <rect width="1200" height="620" rx="34" fill="url(#dots)"/>
  <ellipse cx="835" cy="270" rx="360" ry="280" fill="url(#halo)"/>
  <path d="M0 440Q240 405 480 438T960 430T1200 418V620H0Z" fill="url(#floor)"/>
  <path d="M0 440Q240 405 480 438T960 430T1200 418" fill="none" stroke="#42647c" stroke-width="3"/>

  <!-- Floating workshop lights -->
  <g fill="#fff0b8">
    <circle cx="90" cy="70" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="82" r="4"><animate attributeName="opacity" values="1;.25;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="350" r="3"><animate attributeName="cy" values="350;330;350" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="65" r="2.5"><animate attributeName="r" values="2;5;2" dur="1.7s" repeatCount="indefinite"/></circle>
  </g>
  <g opacity=".55" stroke="#6fa4bd" fill="none" stroke-width="2">
    <path d="M40 365V150Q40 130 60 130H160M1040 120H1140Q1160 120 1160 140V270"/>
    <path d="M52 170H170M1030 292H1148"/>
  </g>

  <!-- Main message: cross-fades between welcome and invitation -->
  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="600" y="82" fill="#9fffe0" font-size="17" font-weight="800" letter-spacing="6">A LITTLE SPACE FOR BIG IDEAS</text>
    <g class="headline-a">
      <text x="600" y="178" fill="#f7fbff" font-size="76" font-weight="900" letter-spacing="-3">IT'S THE</text>
      <text x="600" y="270" fill="url(#sun)" font-size="112" font-weight="950" letter-spacing="-5">WEEKEND!</text>
    </g>
    <g class="headline-b">
      <text x="600" y="178" fill="#f7fbff" font-size="68" font-weight="900" letter-spacing="-2">WHAT ARE YOU</text>
      <text x="600" y="270" fill="url(#mint)" font-size="100" font-weight="950" letter-spacing="-4">BUILDING?</text>
    </g>
    <text x="600" y="320" fill="#d4e7f2" font-size="22" font-weight="600" letter-spacing=".4">Dream it. Make it. Show us what happens.</text>
  </g>

  <!-- Orbiting ideas -->
  <g transform="translate(600 220)" fill="none" stroke="#8cebd8" stroke-opacity=".3" stroke-width="2" stroke-dasharray="5 12">
    <ellipse rx="440" ry="155"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="55s" repeatCount="indefinite"/></ellipse>
  </g>
  <g>
    <g transform="translate(180 205)" filter="url(#shadow)">
      <circle r="43" fill="#233b5b" stroke="#6fdcc9" stroke-width="2"/>
      <path d="M0-24C18-6 18 8 0 25C-18 8-18-6 0-24Z" fill="url(#sun)"/>
      <path d="M-27 0H27M0-30V30" stroke="#fff0b8" stroke-width="2" opacity=".75"/>
      <animateTransform attributeName="transform" type="translate" values="180 205;180 192;180 205" dur="4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(1020 205)" filter="url(#shadow)">
      <circle r="43" fill="#25385c" stroke="#ad9aff" stroke-width="2"/>
      <path d="M-20 9L0-24L20 9L0 24Z" fill="url(#violet)"/>
      <circle r="7" fill="#fff"/>
      <animateTransform attributeName="transform" type="translate" values="1020 205;1020 190;1020 205" dur="3.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Conveyor with moving belt -->
  <g filter="url(#shadow)">
    <path d="M70 465L1125 465L1170 520L35 520Z" fill="#344f68" stroke="#7195aa" stroke-width="3"/>
    <path d="M80 480H1120" stroke="#8cebd8" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 22">
      <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M95 520V555M1110 520V555" stroke="#64849a" stroke-width="12" stroke-linecap="round"/>
    <circle cx="95" cy="558" r="12" fill="#9bb8c7"/><circle cx="1110" cy="558" r="12" fill="#9bb8c7"/>
  </g>

  <!-- A tiny rocket -->
  <g transform="translate(240 430)" filter="url(#shadow)">
    <g>
      <path d="M-6-48Q0-74 17-86Q39-60 34-30L12-7L-10-24Z" fill="url(#sun)" stroke="#fff0c5" stroke-width="3"/>
      <circle cx="19" cy="-48" r="8" fill="#375477" stroke="#fff" stroke-width="3"/>
      <path d="M-9-27L-29-16L-24-45M20-12L40-3L36-32" fill="#ed8a77" stroke="#ffd3ae" stroke-width="3"/>
      <path d="M4-8Q-8 14 5 29Q15 12 13-5" fill="#ff9d70"><animate attributeName="d" values="M4-8Q-8 14 5 29Q15 12 13-5;M4-8Q-17 18 3 40Q20 13 13-5;M4-8Q-8 14 5 29Q15 12 13-5" dur=".65s" repeatCount="indefinite"/></path>
    </g>
    <animateTransform attributeName="transform" type="translate" values="240 430;240 414;240 430" dur="2.8s" repeatCount="indefinite"/>
  </g>

  <!-- Friendly little robot -->
  <g transform="translate(490 420)" filter="url(#shadow)">
    <rect x="-42" y="-65" width="84" height="75" rx="22" fill="url(#blue)" stroke="#d4f5ff" stroke-width="3"/>
    <rect x="-27" y="-48" width="54" height="35" rx="12" fill="#18334d"/>
    <g fill="#a7ffe1"><circle cx="-12" cy="-31" r="5"><animate attributeName="ry" values="5;1;5" dur="3.5s" repeatCount="indefinite"/></circle><circle cx="12" cy="-31" r="5"/></g>
    <path d="M-11-17Q0-8 11-17" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0-66V-83" stroke="#d4f5ff" stroke-width="5" stroke-linecap="round"/>
    <circle cy="-88" r="7" fill="#ffcf86"><animate attributeName="fill" values="#ffcf86;#8cebd8;#ffcf86" dur="2s" repeatCount="indefinite"/></circle>
    <path d="M-42-39L-58-25M42-39L58-25M-20 10V24M20 10V24" stroke="#8cebd8" stroke-width="9" stroke-linecap="round"/>
    <path d="M-58-25L-67-38M58-25L68-39" stroke="#d4f5ff" stroke-width="8" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" values="490 420;490 407;490 420" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- Game controller -->
  <g transform="translate(750 438)" filter="url(#shadow)">
    <path d="M-55-25Q-48-45-28-40H28Q48-45 55-25L67 12Q72 34 52 35Q38 35 24 12H-24Q-38 35-52 35Q-72 34-67 12Z" fill="url(#violet)" stroke="#eee4ff" stroke-width="3"/>
    <path d="M-34-13V13M-47 0H-21" stroke="#253456" stroke-width="8" stroke-linecap="round"/>
    <circle cx="34" cy="-9" r="6" fill="#fff0b8"/><circle cx="49" cy="9" r="6" fill="#8cebd8"/>
    <animateTransform attributeName="transform" type="translate" values="750 438;750 425;750 438" dur="3.3s" repeatCount="indefinite"/>
  </g>

  <!-- A growing idea -->
  <g transform="translate(990 444)" filter="url(#shadow)">
    <path d="M-42 0H42L32 52H-32Z" fill="url(#sun)" stroke="#ffe8b7" stroke-width="3"/>
    <path d="M0 0V-47M0-24Q-37-54-42-25Q-20-5 0-18M0-34Q27-69 43-43Q33-18 0-25" fill="none" stroke="#8cebd8" stroke-width="8" stroke-linecap="round"/>
    <path d="M-14 52V62M14 52V62" stroke="#f5c68f" stroke-width="6"/>
    <animateTransform attributeName="transform" type="translate" values="990 444;990 430;990 444" dur="3.8s" repeatCount="indefinite"/>
  </g>

  <!-- Sparks, gears and confetti -->
  <g>
    <use href="#spark" transform="translate(330 360) scale(.8)"><animateTransform attributeName="transform" type="rotate" from="0 330 360" to="360 330 360" dur="5s" repeatCount="indefinite"/></use>
    <use href="#spark" transform="translate(865 365) scale(.65)"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/></use>
    <use href="#gear" transform="translate(1100 355) scale(.55)"><animateTransform attributeName="transform" type="rotate" from="0 1100 355" to="360 1100 355" dur="12s" repeatCount="indefinite"/></use>
    <g fill="#ffcf86">
      <circle cx="390" cy="385" r="5"><animate attributeName="cy" values="385;365;385" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="370" r="4"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="920" cy="395" r="5"><animate attributeName="cy" values="395;374;395" dur="2.3s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#8cebd8">
      <path d="M140 350l8 13-8 13-8-13Z"><animateTransform attributeName="transform" type="rotate" from="0 140 363" to="360 140 363" dur="7s" repeatCount="indefinite"/></path>
      <path d="M1060 300l7 11-7 11-7-11Z"><animateTransform attributeName="transform" type="rotate" from="0 1060 311" to="-360 1060 311" dur="6s" repeatCount="indefinite"/></path>
    </g>
  </g>

  <!-- Call to action -->
  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="600" y="590" fill="#b7d3df" font-size="16" font-weight="800" letter-spacing="4">MAKE SOMETHING  •  MAKE IT VISIBLE  •  SHARE IT</text>
  </g>

  <style>
    .headline-a,.headline-b{animation:headlineCycle 10s ease-in-out infinite}
    .headline-b{animation-delay:5s;opacity:0}
    @keyframes headlineCycle{
      0%,8%{opacity:0;transform:translateY(12px)}
      16%,42%{opacity:1;transform:translateY(0)}
      50%,100%{opacity:0;transform:translateY(-10px)}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important}
      .headline-a{opacity:1!important;transform:none!important}
      .headline-b{opacity:0!important}
    }
  </style>
</svg>
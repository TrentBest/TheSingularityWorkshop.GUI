<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">It's the weekend. What are you building?</title>
  <desc id="desc">A living miniature maker factory: robotic arms assemble glowing ideas on a moving conveyor while workshop windows light up in the background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10283a"/><stop offset="1" stop-color="#17172f"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25536a"/><stop offset="1" stop-color="#172c49"/></linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#426477"/><stop offset="1" stop-color="#20394b"/></linearGradient>
    <linearGradient id="idea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe5a5"/><stop offset="1" stop-color="#ffad69"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
    <g id="gear" fill="none" stroke="#ffcf86" stroke-width="4" stroke-linejoin="round">
      <circle r="17"/><circle r="5" stroke="#7ee0bd"/>
      <path d="M0-27V-17M0 17V27M-27 0H-17M17 0H27M-19-19L-12-12M12 12L19 19M19-19L12-12M-12 12L-19 19"/>
    </g>
    <g id="bot">
      <path d="M0 0L-12 -34L8 -60L30 -77" fill="none" stroke="#7ee0bd" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-12" cy="-34" r="8" fill="#ffcf86"/><circle cx="8" cy="-60" r="8" fill="#ffcf86"/>
      <path d="M30-77l10-7m-10 7l-1-12" stroke="#d8edf4" stroke-width="4" stroke-linecap="round"/>
      <path d="M-18 4H18" stroke="#7ee0bd" stroke-width="8" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="960" height="420" rx="28" fill="url(#bg)"/>
  <path d="M32 333H928" stroke="#426477" stroke-width="2"/>
  <!-- Factory skyline -->
  <path d="M610 76V48H642V76M648 76V30H674V76M680 76V55H712V76" fill="#203c50" stroke="#52768a" stroke-width="2"/>
  <path d="M624 48V18H632V48M659 30V8H667V30" stroke="#7ee0bd" stroke-opacity=".5" stroke-width="5"/>
  <g fill="#ffcf86" opacity=".8">
    <rect x="620" y="94" width="36" height="26" rx="3"><animate attributeName="opacity" values=".45;1;.45" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="665" y="94" width="36" height="26" rx="3"><animate attributeName="opacity" values="1;.4;1" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="710" y="94" width="36" height="26" rx="3"/>
  </g>
  <!-- Main factory window -->
  <rect x="600" y="132" width="290" height="158" rx="12" fill="url(#glass)" stroke="#5d8294" stroke-width="3"/>
  <path d="M745 134V288M602 211H888" stroke="#5d8294" stroke-width="2"/>
  <circle cx="745" cy="210" r="76" fill="#7ee0bd" opacity=".12" filter="url(#glow)"/>
  <g transform="translate(745 210)">
    <use href="#gear"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/></use>
  </g>
  <!-- Workbench and conveyor -->
  <path d="M54 298H564L590 329H40Z" fill="url(#belt)" stroke="#63889a" stroke-width="3"/>
  <path d="M68 312H558" stroke="#7ee0bd" stroke-width="2" stroke-dasharray="10 14" opacity=".8">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <g>
    <g transform="translate(160 0)"><rect x="0" y="269" width="48" height="29" rx="5" fill="url(#idea)" stroke="#ffe5a5" stroke-width="2"/><path d="M10 269V258H38V269" fill="none" stroke="#ffe5a5" stroke-width="3"/></g>
    <g transform="translate(330 0)"><rect x="0" y="261" width="48" height="37" rx="5" fill="#7ee0bd" stroke="#c1ffea" stroke-width="2"/><path d="M12 273H36M12 283H30" stroke="#153c4b" stroke-width="3"/></g>
    <g transform="translate(500 0)"><path d="M0 298V274L24 252L48 274V298Z" fill="#b9a5ff" stroke="#e1d7ff" stroke-width="2"/><rect x="18" y="281" width="12" height="17" fill="#29304c"/></g>
    <g fill="#ffcf86"><circle cx="184" cy="248" r="4"><animate attributeName="cy" values="248;236;248" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="354" cy="241" r="4"><animate attributeName="cy" values="241;229;241" dur="2.1s" repeatCount="indefinite"/></circle></g>
  </g>
  <!-- Two animated assembly arms -->
  <g transform="translate(214 264)">
    <use href="#bot"><animateTransform attributeName="transform" type="rotate" values="-8 0 0;10 0 0;-8 0 0" dur="3.2s" repeatCount="indefinite"/></use>
  </g>
  <g transform="translate(414 260) scale(.82)">
    <use href="#bot"><animateTransform attributeName="transform" type="rotate" values="12 0 0;-12 0 0;12 0 0" dur="2.7s" repeatCount="indefinite"/></use>
  </g>
  <!-- Tiny spark / activity lights -->
  <g fill="#7ee0bd">
    <circle cx="554" cy="165" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="576" cy="196" r="3"><animate attributeName="cy" values="196;184;196" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="548" cy="224" r="3"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <!-- Invitation -->
  <text x="66" y="78" fill="#7ee0bd" font-family="system-ui,sans-serif" font-size="16" font-weight="800" letter-spacing="4">THE WORKSHOP IS OPEN</text>
  <text x="62" y="145" fill="#f2f7fb" font-family="system-ui,sans-serif" font-size="52" font-weight="850" letter-spacing="-2">IT'S THE</text>
  <text x="62" y="205" fill="#ffcf86" font-family="system-ui,sans-serif" font-size="61" font-weight="900" letter-spacing="-3">WEEKEND.</text>
  <text x="66" y="246" fill="#d7e7ef" font-family="system-ui,sans-serif" font-size="23" font-weight="650">What are you building?</text>
  <path d="M66 355H570" stroke="#31566a" stroke-width="2"/>
  <text x="66" y="385" fill="#91aebe" font-family="system-ui,sans-serif" font-size="14" letter-spacing="2">MAKE SOMETHING. MAKE IT VISIBLE. SHARE IT.</text>
  <circle cx="586" cy="379" r="5" fill="#7ee0bd"><animate attributeName="r" values="4;8;4" dur="1.8s" repeatCount="indefinite"/></circle>
</svg>

<svg width="1280" height="720" viewBox="0 0 100 56.25" preserveAspectRatio="xMidYMid meet" role="img" aria-label="GUI.SVG manifestation gallery" aria-labelledby="gui-svg-title gui-svg-description" xmlns="http://www.w3.org/2000/svg"><title id="gui-svg-title">GUI.SVG manifestation gallery</title><desc id="gui-svg-description">A single semantic scene demonstrating vector geometry, reusable definitions, text, transforms, and declarative SVG animation. A filled star follows the motion path to make the animated semantic entity unmistakable.</desc><rect x="0" y="0" width="100" height="56.25" fill="#0b1725" id="background" /><defs id="definitions"><linearGradient x1="0%" y1="0%" x2="100%" y2="100%" id="workshop-gradient"><stop offset="0%" stop-color="#173b4c" id="gradient-start" /><stop offset="100%" stop-color="#302b58" id="gradient-end" /></linearGradient><clipPath id="panel-clip"><rect x="4" y="4" width="92" height="48.25" fill="none" rx="3" id="clip-panel" /></clipPath><pattern width="8" height="8" patternUnits="userSpaceOnUse" id="circuit-pattern"><path d="M0 8L8 0" fill="none" id="pattern-line" stroke="#7ee0bd" stroke-width="0.3" /></pattern><marker refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto" id="arrowhead"><polygon points="0,0 10,5 0,10" fill="#7ee0bd" id="arrowhead-shape" /></marker><filter id="soft-glow"><feGaussianBlur in="SourceGraphic" stdDeviation="0.5" id="glow-blur" /></filter><filter id="surface-relief"><feTurbulence baseFrequency="0.025 0.06" numOctaves="2" type="fractalNoise" id="relief-noise" /><feDisplacementMap in="SourceGraphic" in2="relief-noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" id="relief-displacement" /><feComponentTransfer id="relief-tone"><feFuncR type="gamma" amplitude="1" exponent="0.95" offset="0" id="relief-red-curve" /></feComponentTransfer></filter><filter id="surface-lighting"><feDiffuseLighting surfaceScale="1.5" diffuseConstant="0.8" id="diffuse-study"><feDistantLight azimuth="225" elevation="40" id="gallery-light" /></feDiffuseLighting></filter><symbol viewBox="0 0 10 10" id="star-symbol"><polygon points="5,0 6.5,3.5 10,4 7.5,6.5 8.2,10 5,8 1.8,10 2.5,6.5 0,4 3.5,3.5" fill="#ffcf86" id="star-shape" /></symbol><path d="M12 38 C24 12 42 48 58 24 S82 16 90 32" fill="none" id="orbit-path" /></defs><rect x="4" y="4" width="92" height="48.25" fill="url(#workshop-gradient)" rx="3" id="panel" stroke="#426478" stroke-width="0.35" clip-path="url(#panel-clip)" /><path d="M9 37 C22 14 34 49 47 28 S72 13 86 31" fill="none" id="curve" stroke="#7ee0bd" stroke-width="0.7" stroke-linecap="round" marker-end="url(#arrowhead)" /><polygon points="73,14 84,10 91,18 83,24" fill="#ffcf86" id="facet" fill-opacity="0.9" stroke="#fff1ce" stroke-width="0.25" filter="url(#surface-relief)" /><circle cx="65" cy="16" r="2" fill="#7ee0bd" id="glow-swatch" filter="url(#soft-glow)" /><polygon points="63,25 67,21 71,25" fill="#ffcf86" id="lit-swatch" filter="url(#surface-lighting)" /><rect x="86" y="39" width="7" height="7" fill="url(#circuit-pattern)" id="pattern-swatch" stroke="#426478" stroke-width="0.25" /><use href="#star-symbol" x="86" y="10" width="7" height="7" id="reused-star" /><circle cx="47" cy="28" r="1.6" fill="#ffcf86" id="animated-marker" stroke="#fff1ce" stroke-width="0.25"><animate attributeName="r" dur="2.4s" repeatCount="indefinite" values="1.6;2.8;1.6" keyTimes="0;0.5;1" id="marker-pulse" /><set attributeName="stroke-width" to="0.5" begin="2s" id="marker-emphasis" /></circle><a href="https://github.com/TrentBest/TheSingularityWorkshop.GUI/blob/development/docs/SVG_ADAPTER.md" target="_blank" rel="noopener" id="heading-link"><text x="9" y="12" fill="#eef6ff" id="heading" font-family="sans-serif" font-size="4" font-weight="700">GUI.SVG</text></a><use href="#star-symbol" x="-1" y="-1" width="2" height="2" id="motion-scout"><animateMotion dur="5s" repeatCount="indefinite" rotate="auto" id="scout-motion"><mpath href="#orbit-path" id="scout-route-reference" /></animateMotion></use><text x="9" y="47" fill="#d6e7f4" id="caption" font-family="sans-serif" font-size="2.4">Semantic model → SVG manifestation</text></svg>
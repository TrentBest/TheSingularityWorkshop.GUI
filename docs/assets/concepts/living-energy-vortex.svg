<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Living SVG energy field</title>
  <desc id="desc">An abstract gold energy field on the left and a blue-white field on the right pulse in alternating phases around a central digital eye. Orbit lines rotate slowly. This is a visual proof of concept, not a GUI renderer output or a physical lighting simulation.</desc>
  <defs>
    <radialGradient id="goldGlow"><stop stop-color="#fff7bf" stop-opacity=".95"/><stop offset=".28" stop-color="#fbbf24" stop-opacity=".55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <radialGradient id="blueGlow"><stop stop-color="#eff6ff" stop-opacity=".95"/><stop offset=".3" stop-color="#60a5fa" stop-opacity=".6"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <radialGradient id="iris"><stop stop-color="#020617" offset="0"/><stop stop-color="#0f172a" offset=".35"/><stop stop-color="#38bdf8" offset=".58"/><stop stop-color="#e0f2fe" offset=".68"/><stop stop-color="#2563eb" offset=".8"/><stop stop-color="#020617" offset="1"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="spark"><feGaussianBlur stdDeviation="2.5"/></filter>
    <linearGradient id="field"><stop stop-color="#fbbf24"/><stop offset=".48" stop-color="#f8fafc"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="960" height="420" rx="22" fill="#050816"/>
  <g opacity=".12" stroke="#94a3b8" stroke-width=".6">
    <path d="M0 60H960M0 120H960M0 180H960M0 240H960M0 300H960M0 360H960"/>
    <path d="M60 0V420M120 0V420M180 0V420M240 0V420M300 0V420M360 0V420M420 0V420M480 0V420M540 0V420M600 0V420M660 0V420M720 0V420M780 0V420M840 0V420M900 0V420"/>
  </g>
  <circle cx="220" cy="210" r="175" fill="url(#goldGlow)" filter="url(#soft)" class="gold-halo"/>
  <circle cx="740" cy="210" r="175" fill="url(#blueGlow)" filter="url(#soft)" class="blue-halo"/>
  <g fill="none" stroke-width="1.4" opacity=".65">
    <ellipse cx="480" cy="210" rx="360" ry="112" stroke="url(#field)" transform="rotate(-18 480 210)"/>
    <ellipse cx="480" cy="210" rx="340" ry="142" stroke="url(#field)" transform="rotate(26 480 210)"/>
    <ellipse cx="480" cy="210" rx="300" ry="172" stroke="url(#field)" transform="rotate(65 480 210)"/>
  </g>
  <g class="orbit" transform-origin="480px 210px" fill="none" stroke-linecap="round">
    <ellipse rx="180" ry="66" stroke="#fcd34d" stroke-width="2" stroke-dasharray="2 13"/>
    <ellipse rx="210" ry="90" stroke="#93c5fd" stroke-width="2" stroke-dasharray="1 17" transform="rotate(60)"/>
    <ellipse rx="155" ry="116" stroke="#e0f2fe" stroke-width="1.2" stroke-dasharray="1 10" transform="rotate(-34)"/>
  </g>
  <g class="gold-pulse"><circle cx="220" cy="210" r="78" fill="url(#goldGlow)"/><path d="M80 210 Q150 145 220 210 Q290 275 360 210 Q290 145 220 210 Q150 275 80 210Z" fill="none" stroke="#fcd34d" stroke-width="2.5"/></g>
  <g class="blue-pulse"><circle cx="740" cy="210" r="78" fill="url(#blueGlow)"/><path d="M600 210 Q670 145 740 210 Q810 275 880 210 Q810 145 740 210 Q670 275 600 210Z" fill="none" stroke="#bfdbfe" stroke-width="2.5"/></g>
  <circle cx="480" cy="210" r="92" fill="#020617" stroke="url(#field)" stroke-width="2"/>
  <g class="eye-breathe">
    <path d="M400 210 Q480 143 560 210 Q480 277 400 210Z" fill="#0b1225" stroke="#bae6fd" stroke-width="2"/>
    <circle cx="480" cy="210" r="43" fill="url(#iris)"/>
    <ellipse cx="480" cy="210" rx="8" ry="27" fill="#020617"/>
    <circle cx="466" cy="194" r="7" fill="#fff" opacity=".9"/>
    <circle cx="495" cy="225" r="3" fill="#f8fafc"/>
  </g>
  <g class="data-sparks" fill="#f8fafc">
    <circle cx="378" cy="139" r="2.5"/><circle cx="590" cy="152" r="2"/><circle cx="369" cy="264" r="2"/><circle cx="575" cy="282" r="3"/><circle cx="430" cy="105" r="1.8"/><circle cx="528" cy="315" r="2"/>
  </g>
  <text x="28" y="36" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="14" letter-spacing="2">LIVING SVG / MOTION STUDY</text>
  <text x="28" y="394" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">Alternating phase • slow orbit • breathing focal point • reduced-motion aware</text>
  <style>
    .gold-halo,.blue-halo{animation:glow 7s ease-in-out infinite alternate}
    .blue-halo{animation-delay:-3.5s}
    .gold-pulse{transform-origin:220px 210px;animation:phase 7s ease-in-out infinite}
    .blue-pulse{transform-origin:740px 210px;animation:phase 7s ease-in-out -3.5s infinite}
    .orbit{animation:orbit 42s linear infinite}
    .eye-breathe{transform-origin:480px 210px;animation:breathe 5s ease-in-out infinite}
    .data-sparks{animation:sizzle 2.4s steps(2,end) infinite}
    @keyframes glow{0%,100%{opacity:.42}50%{opacity:1}}
    @keyframes phase{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes breathe{0%,100%{transform:scale(.96);filter:brightness(.9)}50%{transform:scale(1.05);filter:brightness(1.25)}}
    @keyframes sizzle{0%{opacity:.3}50%{opacity:1}100%{opacity:.55}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.gold-halo,.blue-halo{opacity:.7}.gold-pulse,.blue-pulse,.eye-breathe,.data-sparks{transform:none;opacity:.8}}
  </style>
</svg>
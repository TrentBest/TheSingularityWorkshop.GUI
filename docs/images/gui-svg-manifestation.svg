<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">The GUI semantic boundary: one meaning, many manifestations</title>
<desc id="desc">A luminous semantic GUI tree sits at the center. Animated pathways connect it to SVG vector artifacts, Blazor browser interfaces, and WPF desktop interfaces. FSM COS is shown separately as the runtime composition owner, not as a renderer.</desc>
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset=".55" stop-color="#111b31"/><stop offset="1" stop-color="#08111e"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d69e32"/><stop offset=".5" stop-color="#fff0b5"/><stop offset="1" stop-color="#d69e32"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#c5f5ff"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <radialGradient id="coreGlow"><stop stop-color="#f9d878" stop-opacity=".2"/><stop offset="1" stop-color="#f9d878" stop-opacity="0"/></radialGradient>
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f4f7ff}
    .sub{fill:#b6c4d8;font-size:16px}.tiny{fill:#8fa3be;font-size:13px;letter-spacing:1.5px}
    .route{fill:none;stroke:#536982;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:5 11;animation:travel 12s linear infinite}
    .pulse{fill:none;stroke:#f7d777;stroke-width:2;stroke-dasharray:2 22;stroke-linecap:round;animation:travel 4s linear infinite;filter:url(#softGlow)}
    .halo{transform-origin:600px 280px;animation:orbit 28s linear infinite}
    .breath{animation:breath 5s ease-in-out infinite}
    .card{fill:#101d30;stroke:#344a65;stroke-width:1.5}
    .node{fill:#172b43;stroke:#6484a6;stroke-width:1.4}
    .dot{fill:#e8faff;filter:url(#softGlow)}
    @keyframes travel{to{stroke-dashoffset:-256}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes breath{0%,100%{opacity:.65}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.route,.pulse,.halo,.breath{animation:none}}
  </style>
</defs>
<rect width="1200" height="700" rx="28" fill="url(#back)"/>
<circle cx="600" cy="275" r="275" fill="url(#coreGlow)"/>
<g opacity=".16" stroke="#8da6c4" stroke-width="1">
 <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200"/>
 <path d="M100 0V700M200 0V700M300 0V700M400 0V700M500 0V700M600 0V700M700 0V700M800 0V700M900 0V700M1000 0V700M1100 0V700"/>
</g>
<text x="600" y="54" text-anchor="middle" font-size="30" font-weight="750" letter-spacing=".5">ONE MEANING. MANY MANIFESTATIONS.</text>
<text x="600" y="83" text-anchor="middle" class="sub">Describe the experience before choosing how it appears.</text>
<g class="halo" fill="none" stroke="#b5c8dc" stroke-opacity=".22">
 <ellipse cx="600" cy="280" rx="260" ry="124" stroke-dasharray="3 12"/>
 <ellipse cx="600" cy="280" rx="225" ry="98" stroke-dasharray="1 9"/>
</g>
<!-- Semantic tree -->
<g class="breath">
 <rect x="390" y="132" width="420" height="285" rx="22" fill="#0e1c2e" stroke="url(#gold)" stroke-width="2.4" filter="url(#softGlow)"/>
 <path d="M410 180H790" stroke="#c9a54f" stroke-opacity=".45"/>
 <circle cx="420" cy="157" r="4" fill="#f9d878"/><circle cx="434" cy="157" r="4" fill="#f9d878" opacity=".55"/><circle cx="448" cy="157" r="4" fill="#f9d878" opacity=".25"/>
 <text x="600" y="163" text-anchor="middle" font-size="23" font-weight="750">GUI.Core</text>
 <text x="600" y="205" text-anchor="middle" class="tiny">SEMANTIC MODEL</text>
 <text x="600" y="232" text-anchor="middle" class="sub">GuiNode · identity · properties · children</text>
 <path d="M600 249V268M600 268H485V286M600 268V286M600 268H715V286" fill="none" stroke="#d6b65e" stroke-width="2"/>
 <rect class="node" x="430" y="286" width="110" height="45" rx="8"/><text x="485" y="313" text-anchor="middle" font-size="15">Text</text>
 <rect class="node" x="545" y="286" width="110" height="45" rx="8"/><text x="600" y="313" text-anchor="middle" font-size="15">Button</text>
 <rect class="node" x="660" y="286" width="110" height="45" rx="8"/><text x="715" y="313" text-anchor="middle" font-size="15">Panel</text>
 <text x="600" y="366" text-anchor="middle" class="sub">What the interface means</text>
 <text x="600" y="390" text-anchor="middle" class="tiny">NOT A NATIVE WIDGET TREE</text>
</g>
<!-- branching routes -->
<path class="route" d="M470 417V451H205V488"/>
<path class="pulse" d="M470 417V451H205V488"/>
<path class="route" d="M600 417V488"/><path class="pulse" d="M600 417V488"/>
<path class="route" d="M730 417V451H995V488"/><path class="pulse" d="M730 417V451H995V488"/>
<circle class="dot" r="4"><animateMotion dur="4.6s" repeatCount="indefinite" path="M470 417V451H205V488"/></circle>
<circle class="dot" r="4"><animateMotion dur="3.8s" repeatCount="indefinite" path="M600 417V488"/></circle>
<circle class="dot" r="4"><animateMotion dur="5.1s" repeatCount="indefinite" path="M730 417V451H995V488"/></circle>
<!-- manifestation cards -->
<g>
 <rect class="card" x="70" y="488" width="270" height="112" rx="16" stroke="#67e8f9"/>
 <text x="205" y="525" text-anchor="middle" font-size="22" font-weight="700">GUI.SVG</text>
 <text x="205" y="552" text-anchor="middle" class="sub">Vector artifact</text>
 <text x="205" y="576" text-anchor="middle" class="tiny">DIAGRAMS · DOCUMENTS · MOTION</text>
</g>
<g>
 <rect class="card" x="465" y="488" width="270" height="112" rx="16" stroke="#22d3ee"/>
 <text x="600" y="525" text-anchor="middle" font-size="22" font-weight="700">GUI.Blazor</text>
 <text x="600" y="552" text-anchor="middle" class="sub">Browser manifestation</text>
 <text x="600" y="576" text-anchor="middle" class="tiny">WEB HOST · INTERACTION</text>
</g>
<g>
 <rect class="card" x="860" y="488" width="270" height="112" rx="16" stroke="#fbbf24"/>
 <text x="995" y="525" text-anchor="middle" font-size="22" font-weight="700">GUI.WPF</text>
 <text x="995" y="552" text-anchor="middle" class="sub">Native desktop</text>
 <text x="995" y="576" text-anchor="middle" class="tiny">WINDOWS · NATIVE BUILDERS</text>
</g>
<!-- separate composition owner -->
<rect x="365" y="628" width="470" height="42" rx="12" fill="#172337" stroke="#526985"/>
<text x="600" y="654" text-anchor="middle" font-size="15" font-weight="650">FSM_COS owns runtime composition — not rendering</text>
<text x="600" y="690" text-anchor="middle" class="tiny">ARCHITECTURE STUDY · SVG ILLUSTRATION, NOT GENERATED RUNTIME OUTPUT</text>
</svg>
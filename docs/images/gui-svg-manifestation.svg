<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">One semantic GUI, multiple manifestations</title><desc id="desc">GUI Core semantic tree connects to SVG, Blazor, and WPF. Core owns meaning; manifestations own presentation.</desc>
<defs><linearGradient id="core"><stop stop-color="#d8a238"/><stop offset="1" stop-color="#ffe7a0"/></linearGradient><style>text{font-family:system-ui,sans-serif;fill:#f8fafc}.muted{fill:#cbd5e1;font-size:14px}.flow{fill:none;stroke:#94a3b8;stroke-width:2.5;stroke-dasharray:7 7;animation:flow 9s linear infinite}.glow{animation:breathe 5s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-56}}@keyframes breathe{0%,100%{opacity:.58}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.glow{animation:none}}</style></defs>
<rect width="960" height="500" rx="24" fill="#0b1220"/><text x="480" y="42" text-anchor="middle" font-size="24" font-weight="700">Meaning stays stable. Presentation adapts.</text>
<rect x="330" y="82" width="300" height="124" rx="16" fill="#1e293b" stroke="url(#core)" stroke-width="2" class="glow"/><text x="480" y="119" text-anchor="middle" font-size="21" font-weight="700">GUI.Core</text><text x="480" y="148" text-anchor="middle" class="muted">GuiNode semantic tree</text><text x="480" y="173" text-anchor="middle" class="muted">what the interface means</text>
<path class="flow" d="M480 206 V246 H160 V294 M480 246 V294 M480 246 H800 V294"/>
<rect x="55" y="294" width="210" height="116" rx="14" fill="#172554" stroke="#67e8f9" stroke-width="2"/><text x="160" y="329" text-anchor="middle" font-size="20" font-weight="700">GUI.SVG</text><text x="160" y="355" text-anchor="middle" class="muted">vector documents</text><text x="160" y="378" text-anchor="middle" class="muted">diagrams · motion</text>
<rect x="375" y="294" width="210" height="116" rx="14" fill="#164e63" stroke="#67e8f9" stroke-width="2"/><text x="480" y="329" text-anchor="middle" font-size="20" font-weight="700">GUI.Blazor</text><text x="480" y="355" text-anchor="middle" class="muted">browser components</text><text x="480" y="378" text-anchor="middle" class="muted">HTML · events</text>
<rect x="695" y="294" width="210" height="116" rx="14" fill="#422006" stroke="#fbbf24" stroke-width="2"/><text x="800" y="329" text-anchor="middle" font-size="20" font-weight="700">GUI.WPF</text><text x="800" y="355" text-anchor="middle" class="muted">native desktop</text><text x="800" y="378" text-anchor="middle" class="muted">controls · windows</text><text x="480" y="460" text-anchor="middle" class="muted">Architecture illustration — not generated runtime output</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="demo-title demo-desc" font-family="Segoe UI, Arial, sans-serif">
<title id="demo-title">Directed repository graph with an ADP cluster</title>
<desc id="demo-desc">CiAi is the focal repository, connected by directed arrows to GUI and FSM API inside a dashed ADP cluster. WebPage is an external dependent.</desc>
<rect width="900" height="470" fill="#fff"/>
<path d="M 130 76 V 365 H 770 V 76 M 130 76 H 390 M 510 76 H 770" fill="none" stroke="#687b89" stroke-width="2" stroke-dasharray="9 6"/>
<text x="450" y="67" text-anchor="middle" font-size="18" font-weight="600" fill="#344955">ADP</text>
<g fill="#f7fafc" stroke="#315b72" stroke-width="2">
<rect x="335" y="170" width="230" height="84" rx="10" stroke="#9a5b16" stroke-width="4"/>
<rect x="165" y="300" width="190" height="64" rx="8"/>
<rect x="545" y="300" width="190" height="64" rx="8"/>
<rect x="45" y="170" width="190" height="64" rx="8"/>
</g>
<g fill="#172b36" text-anchor="middle">
<text x="450" y="203" font-size="18" font-weight="700">CiAi</text><text x="450" y="228" font-size="12">Focal repository</text>
<text x="260" y="327" font-size="16" font-weight="600">GUI</text><text x="260" y="347" font-size="11">SVG renderer</text>
<text x="640" y="327" font-size="16" font-weight="600">FSM_API</text><text x="640" y="347" font-size="11">State machinery</text>
<text x="140" y="197" font-size="15" font-weight="600">WebPage</text>
</g>
<g fill="none" stroke="#315b72" stroke-width="2" marker-end="url(#arrow)">
<path d="M 390 254 L 300 300"/><path d="M 510 254 L 600 300"/><path d="M 335 212 L 235 202"/>
</g>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#315b72"/></marker></defs>
<text x="345" y="278" font-size="11" fill="#344955">uses renderer</text>
<text x="555" y="278" font-size="11" fill="#344955">depends on</text>
<text x="286" y="188" font-size="11" fill="#344955">dependent</text>
<rect x="24" y="414" width="12" height="12" fill="#f7fafc" stroke="#315b72"/><text x="44" y="425" font-size="12" fill="#344955">Repository</text>
<text x="876" y="452" text-anchor="end" font-size="10" fill="#5c6870">Illustrative only · no live build/evidence state</text>
</svg>